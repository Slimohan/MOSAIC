# mosaic_camera.cfg
#
# MOSAIC: the CAMERA calibration (method 2 of the installer).
#
# X and Y: a camera looks up at the nozzle. You centre every nozzle in the crosshair
#          (the Alignment tab of the MOSAIC page, or the console) and the macros turn
#          that into X and Y tool offsets.
# Z:       measured with the Z switch, by MOSAIC_CALIBRATE_Z (core/mosaic.cfg).
#
# The session:
#   MOSAIC_START               the reference tool (T0) goes over the camera
#   MOSAIC_MOVE X= Y= Z=       small moves (the arrows of the page) until the nozzle is centred
#   MOSAIC_SET_TOOL            save: T0 = the camera reference, every other tool = its X and Y offset
#   MOSAIC_LOAD_TOOL T=n       mount tool n over the camera, centre it, MOSAIC_SET_TOOL
#   MOSAIC_END                 finish: the reference tool is mounted, the LED is off
#
# Loaded from MOSAIC/mosaic.cfg (section 1) when you chose the camera method. Change
# settings in section 2 of that file, never in this one.
#
# Klipper strips everything after a hash sign on every line, so comments in
# this file are always whole lines.

[gcode_macro _MOSAIC_CAMERA_SETTINGS]
description: Settings of the MOSAIC camera alignment. Not a command.
# Approximate position of the camera centre in gcode coordinates. The first
# session starts here, the exact position is saved when you set the reference tool.
variable_camera_x: 100.0
variable_camera_y: 30.0
# Nozzle height in gcode coordinates where the nozzle tip is in focus.
# The exact height is saved when you set the reference tool.
variable_focus_z: 8.0
# Largest single move of MOSAIC_MOVE in mm
variable_xy_move_limit: 2.0
variable_z_move_limit: 1.0
# LED ring brightness 0.0 to 1.0, only used when a [neopixel mosaic_led] exists
variable_led_brightness: 1.0
# Camera cooling: part cooling fan speed 0.0 to 1.0 of the tool in front of the
# camera when the bed is hotter than the given temperature. 0 disables it.
variable_camera_cooling_fan_speed: 0.0
variable_camera_cooling_bed_temp: 50
gcode:

[gcode_macro _MOSAIC_CAMERA_STATE]
description: Internal state of the MOSAIC camera alignment. Not a command.
variable_active: False
gcode:

[gcode_macro _MOSAIC_LED]
description: Switch the MOSAIC LED ring. STATE=ON|OFF
gcode:
    {% set c = printer["gcode_macro _MOSAIC_CAMERA_SETTINGS"] %}
    {% if printer["neopixel mosaic_led"] is defined %}
        {% set b = c.led_brightness|float if params.STATE|default("ON")|upper == "ON" else 0.0 %}
        SET_LED LED=mosaic_led RED={b} GREEN={b} BLUE={b} TRANSMIT=1
    {% endif %}

[gcode_macro _MOSAIC_GOTO_CAMERA]
description: Move to the saved camera position and the focus height (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set c = printer["gcode_macro _MOSAIC_CAMERA_SETTINGS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set cx = svv.mosaic_ref_x|default(c.camera_x)|float %}
    {% set cy = svv.mosaic_ref_y|default(c.camera_y)|float %}
    {% set cz = svv.mosaic_ref_z|default(c.focus_z)|float %}
    _MOSAIC_SAFE_Z
    G90
    G1 X{cx} Y{cy} F{s.travel_speed|float * 60}
    G1 Z{cz} F{s.z_speed|float * 60}

[gcode_macro _MOSAIC_CAMERA_COOLING]
description: Run the part cooling fan of tool T when the bed is hot. T=-1 stops all fans (internal)
gcode:
    {% set c = printer["gcode_macro _MOSAIC_CAMERA_SETTINGS"] %}
    {% set t = params.T|default(-1)|int %}
    {% set speed = c.camera_cooling_fan_speed|float %}
    {% if speed > 0 and printer.heater_bed is defined %}
        {% for n in printer.toolchanger.tool_numbers %}
            {% if n == t and printer.heater_bed.temperature|float >= c.camera_cooling_bed_temp|float %}
                M106 S{(speed * 255)|int} T{n}
            {% else %}
                M107 T{n}
            {% endif %}
        {% endfor %}
    {% endif %}

# ---------------------------------------------------------------------------
# The session
# ---------------------------------------------------------------------------
[gcode_macro MOSAIC_START]
description: Start the camera alignment. Moves the reference tool over the camera. RESET=1 zeroes the XY and Z offsets of the other tools first.
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_CAMERA_STATE"] %}
    {% set method = s.offset_method|string|lower %}
    {% set ref = s.reference_tool|int %}
    {% set printing = (printer.print_stats is defined and printer.print_stats.state|default('') in ['printing', 'paused']) or (printer["gcode_macro _MOSAIC_DOCK_STATE"] is defined and printer["gcode_macro _MOSAIC_DOCK_STATE"].force_printing|default(0)|int == 1) %}
    {% set ns = namespace(err="") %}
    {% if st.active|string|lower == 'true' %}
        {% set ns.err = "A MOSAIC session is already running. Finish it with MOSAIC_END." %}
    {% elif printer.toolchanger is not defined %}
        {% set ns.err = "klipper-toolchanger is not configured." %}
    {% elif printer.save_variables is not defined %}
        {% set ns.err = "A [save_variables] section is required." %}
    {% elif ref not in printer.toolchanger.tool_numbers %}
        {% set ns.err = "The reference tool T" ~ ref ~ " does not exist." %}
    {% elif printing %}
        {% set ns.err = "A print is running or paused. The alignment moves the toolhead and changes tools, so it is not done during a print." %}
    {% elif printer.toolhead.homed_axes != "xyz" %}
        {% set ns.err = "Home all axes first." %}
    {% elif method not in ['tool_parameter', 'gcode_offset'] %}
        {% set ns.err = "offset_method in _MOSAIC_SETTINGS must be tool_parameter or gcode_offset." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was done."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_CAMERA_STATE VARIABLE=active VALUE=True
        _MOSAIC_START_PREPARE
        {% if params.RESET|default(0)|int == 1 %}
            _MOSAIC_START_RESET
        {% endif %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={ref}
        _MOSAIC_GOTO_CAMERA
        _MOSAIC_LED STATE=ON
        _MOSAIC_CAMERA_COOLING T={ref}
        _MOSAIC_ECHO MSG="Session started with T{ref}. Centre the nozzle in the crosshair (MOSAIC_MOVE X= Y= Z=) and run MOSAIC_SET_TOOL. Then MOSAIC_LOAD_TOOL T=<n> for every other tool."
    {% endif %}

[gcode_macro _MOSAIC_START_PREPARE]
description: Save the gcode state and neutralise user offsets (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    SAVE_GCODE_STATE NAME=_MOSAIC
    G90
    {% if s.offset_method|string|lower == 'tool_parameter' %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

[gcode_macro _MOSAIC_START_RESET]
description: Zero the offsets of the non-reference tools, even when one of them is mounted (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set ref = s.reference_tool|int %}
    {% if printer.toolchanger.tool_number|int != ref and printer.toolchanger.tool_number|int != -1 %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={ref}
    {% endif %}
    MOSAIC_RESET_OFFSETS

[gcode_macro MOSAIC_LOAD_TOOL]
description: Pick up tool T and move it over the camera. T=<tool number>
gcode:
    {% set st = printer["gcode_macro _MOSAIC_CAMERA_STATE"] %}
    {% set t = params.T|default(-1)|int %}
    {% set ns = namespace(err="") %}
    {% if st.active|string|lower != 'true' %}
        {% set ns.err = "No MOSAIC session. Run MOSAIC_START first." %}
    {% elif t not in printer.toolchanger.tool_numbers %}
        {% set ns.err = "Tool T" ~ t ~ " does not exist." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was done."
    {% else %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={t}
        _MOSAIC_GOTO_CAMERA
        _MOSAIC_CAMERA_COOLING T={t}
    {% endif %}

[gcode_macro MOSAIC_MOVE]
description: Small relative move for centring the nozzle. X= Y= Z= in mm
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set c = printer["gcode_macro _MOSAIC_CAMERA_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_CAMERA_STATE"] %}
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set z = params.Z|default(0)|float %}
    {% set ns = namespace(err="") %}
    {% if st.active|string|lower != 'true' %}
        {% set ns.err = "No MOSAIC session. Run MOSAIC_START first." %}
    {% elif x|abs > c.xy_move_limit|float or y|abs > c.xy_move_limit|float or z|abs > c.z_move_limit|float %}
        {% set ns.err = "Move too large. Limits per command: XY " ~ c.xy_move_limit ~ " mm, Z " ~ c.z_move_limit ~ " mm." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was done."
    {% else %}
        G91
        {% if z != 0 %}
            G1 Z{z} F300
        {% endif %}
        {% if x != 0 or y != 0 %}
            G1 X{x} Y{y} F{s.travel_speed|float * 60}
        {% endif %}
        G90
    {% endif %}

[gcode_macro MOSAIC_SET_TOOL]
description: The nozzle of the mounted tool is centred. Save it (reference tool: camera position, other tools: XY offsets).
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_CAMERA_STATE"] %}
    {% set svv = printer.save_variables.variables %}
    {% set method = s.offset_method|string|lower %}
    {% set ref = s.reference_tool|int %}
    {% set t = printer.toolchanger.tool_number|int %}
    {% set gp = printer.gcode_move.gcode_position %}
    {% set limit = s.max_offset|float %}
    {% set lim_x = s.max_offset_x|default(0)|float if s.max_offset_x|default(0)|float > 0 else limit %}
    {% set lim_y = s.max_offset_y|default(0)|float if s.max_offset_y|default(0)|float > 0 else limit %}
    {% set ns = namespace(err="", name="") %}
    {% if st.active|string|lower != 'true' %}
        {% set ns.err = "No MOSAIC session. Run MOSAIC_START first." %}
    {% elif t == -1 %}
        {% set ns.err = "No tool is mounted." %}
    {% elif t != ref and svv.mosaic_ref_x is not defined %}
        {% set ns.err = "No reference position yet. Mount the reference tool, centre it and run MOSAIC_SET_TOOL first." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was saved."
    {% elif t == ref %}
        SAVE_VARIABLE VARIABLE=mosaic_ref_x VALUE={gp.x|float|round(4)}
        SAVE_VARIABLE VARIABLE=mosaic_ref_y VALUE={gp.y|float|round(4)}
        SAVE_VARIABLE VARIABLE=mosaic_ref_z VALUE={gp.z|float|round(4)}
        _MOSAIC_ECHO MSG="Camera reference saved: X {'%.4f' % gp.x|float} Y {'%.4f' % gp.y|float} focus Z {'%.4f' % gp.z|float}. Offsets of the other tools relate to this position, align them again."
    {% else %}
        {% if method == 'tool_parameter' %}
            {% for i in range(printer.toolchanger.tool_numbers|length) %}
                {% if printer.toolchanger.tool_numbers[i]|int == t %}
                    {% set ns.name = printer.toolchanger.tool_names[i] %}
                {% endif %}
            {% endfor %}
            {% set old_x = printer[ns.name].gcode_x_offset|float %}
            {% set old_y = printer[ns.name].gcode_y_offset|float %}
            {% set old_z = printer[ns.name].gcode_z_offset|float %}
        {% else %}
            {% set old_x = printer.gcode_move.homing_origin.x|float %}
            {% set old_y = printer.gcode_move.homing_origin.y|float %}
            {% set old_z = printer.gcode_move.homing_origin.z|float %}
        {% endif %}
        {% set new_x = (old_x + gp.x|float - svv.mosaic_ref_x|float)|round(3) %}
        {% set new_y = (old_y + gp.y|float - svv.mosaic_ref_y|float)|round(3) %}
        {% if new_x|abs > lim_x or new_y|abs > lim_y %}
            _MOSAIC_ECHO TYPE=warning MSG="{'T%d: the offset X %.3f Y %.3f is more than max_offset (X %.1f, Y %.1f mm) from the reference tool, so it was not saved. Is the tool seated, and is the nozzle you centred the right one?' % (t, new_x, new_y, lim_x, lim_y)}"
        {% else %}
            _MOSAIC_STORE_OFFSET T={t} X={new_x} Y={new_y} Z={old_z}
            {% if method == 'tool_parameter' %}
                # the offset changed, so the gcode position of the same spot changed.
                # This move does not move the nozzle, it makes Klipper's position match.
                G90
                G1 X{svv.mosaic_ref_x|float} Y{svv.mosaic_ref_y|float} F600
            {% else %}
                SET_GCODE_OFFSET X={new_x} Y={new_y}
            {% endif %}
            _MOSAIC_ECHO MSG="T{t} offset saved: X {'%.3f' % new_x} Y {'%.3f' % new_y} (Z {'%.3f' % old_z}, measure it with MOSAIC_CALIBRATE_Z)"
        {% endif %}
    {% endif %}

[gcode_macro MOSAIC_END]
description: Finish the camera session. The reference tool is mounted and the LED is off.
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_CAMERA_STATE"] %}
    {% set ref = s.reference_tool|int %}
    {% if st.active|string|lower != 'true' %}
        _MOSAIC_ECHO TYPE=warning MSG="No MOSAIC session is running."
    {% else %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={ref}
        _MOSAIC_LED STATE=OFF
        _MOSAIC_CAMERA_COOLING T=-1
        {% if s.offset_method|string|lower == 'tool_parameter' %}
            RESTORE_GCODE_STATE NAME=_MOSAIC MOVE=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_CAMERA_STATE VARIABLE=active VALUE=False
        MOSAIC_ECHO_OFFSETS
    {% endif %}
