# Hardware of the VAOC camera module. Adjust the pins and the offsets.
# Put it into printer.cfg or include it.

# The nozzle presses this switch from above. The pin is the switch input,
# normally closed to ground with the pull-up ^ ; add ! to invert.
[vaoc_z_probe]
pin: ^PG15
# Switch centre relative to the camera centre, in mm (measure it, or take it
# from the CAD of your VAOC mount).
x_offset: 37.5
y_offset: 0.0
speed: 3
lift_speed: 10
samples: 5
sample_retract_dist: 1.5
samples_result: median
samples_tolerance: 0.02
samples_tolerance_retries: 3
# Fallback search distance for VAOC_Z_PROBE typed by hand
max_travel: 6

# LED ring of the camera. Optional. The name vaoc_led is what the macros look for.
[neopixel vaoc_led]
pin: PB0
chain_count: 12
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# Camera fan. Optional.
[heater_fan vaoc_fan]
pin: PB1
heater: heater_bed
heater_temp: 50.0

# Needed once for the saved offsets. Skip it if you already have one.
[save_variables]
filename: ~/printer_data/config/variables.cfg
