# vrtx_tools.cfg
# The VRTX tool commands: core/vrtx_tools_core.cfg (temperatures, filament per
# tool, shared extruder, the changer hooks, ...) and the commands T0 ... T9.
#
# Mainsail shows a tool button for every T command, so a printer with fewer tools
# gets buttons for tools it does not have. To load only the T commands of your tools,
# replace  [include core/vrtx_tools.cfg]  in section 1 of vrtx.cfg with
#   [include core/vrtx_tools_core.cfg]
#   [include core/t_commands/T[0-4].cfg]
# (T[0-4] = T0 to T4; T[0-2] for three tools, T* for all ten).
[include vrtx_tools_core.cfg]
[include t_commands/T*.cfg]
