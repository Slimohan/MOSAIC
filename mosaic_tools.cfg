# mosaic_tools.cfg
#
# Tool commands T0 ... T9 for tool changers that use
# klipper-toolchanger, made for printers that swap only the hotend: one extruder,
# and every tool has its own heater, thermistor and fan.
#
#   T0 ... T9              mount a tool (what the slicer's tool change line calls)
#   MOSAIC_SET_TEMP          set the temperature of a tool, with or without waiting
#   MOSAIC_TOOL_STANDBY      put a tool on its standby temperature
#   MOSAIC_TOOLS_OFF         switch all tool heaters off
#   MOSAIC_TOOLS_STATUS      one line per tool in the console
#   MOSAIC_SET_FILAMENT      the filament loaded in a tool: material, colour, name, temperature
#   MOSAIC_TOOL_LOG          the last tool changes with their time and result
#
# Optional, in mosaic_tool_heaters.cfg: M104 / M109 with a T parameter, so that
# slicer lines such as "M104 T1 S220" reach the heater of tool 1.
#
# MOSAIC/mosaic.cfg loads it BEFORE the [tool Tn] sections (its section 5);
# otherwise klipper-toolchanger registers its own T0 ... T9 first and Klipper
# refuses the macros of the same name. MOSAIC_CHECK tells you if that happened.
# Change its settings in section 2 of MOSAIC/mosaic.cfg.
#
# Klipper strips everything after a hash sign on every line, so comments in
# this file are always whole lines.

[gcode_macro _MOSAIC_TOOLS_SETTINGS]
description: Settings of the MOSAIC tool commands. Not a command.
# What happens to the heater of a tool that is put away by a tool change.
#   off:     nothing. The slicer or your own macros look after the temperatures.
#   standby: the old tool goes to standby_temp and returns to its previous
#            temperature when it is mounted again.
variable_standby_mode: 'off'
# Standby temperature in C, 0 switches the heater off. Also used by
# MOSAIC_TOOL_STANDBY and the page.
variable_standby_temp: 0.0
# standby mode only: wait for the temperature after a tool is mounted again
variable_wait_on_select: True
# Temperature buttons on the page, "name:temperature" separated by commas.
# A tool can have its own list: add variable_presets_t3: 'TPU:225' (for T3)
# to your own [gcode_macro _MOSAIC_TOOLS_SETTINGS] section. '' = no buttons.
variable_presets: 'PLA:215, PETG:240, ABS:255'
# Copy the filament of every tool into Moonraker's lane_data, so OrcaSlicer's
# "Synchronize filaments" picks up the colour and material of every tool.
# Done by the MOSAIC page service (mosaic); False switches it off.
variable_slicer_sync: True
# Names of the tool switches: the [gcode_button ...] sections in your own
# board file or in section 6. MOSAIC only reads them, so they can have any name.
#   head_switch:   the carriage switch, pressed while a tool is attached
#   dock_switches: one per tool in tool order T0, T1, T2 ... separated by
#                  commas. A missing or empty entry means mosaic_dock_t<n>.
# A switch that does not exist is skipped.
variable_head_switch: 'mosaic_head'
variable_dock_switches: ''
gcode:

[gcode_macro _MOSAIC_TOOLS_STATE]
description: Internal state of the MOSAIC tool commands. Not a command.
# Temperature a tool was at before it went to standby. 0 = nothing to restore.
variable_t0_wanted: 0.0
variable_t1_wanted: 0.0
variable_t2_wanted: 0.0
variable_t3_wanted: 0.0
variable_t4_wanted: 0.0
variable_t5_wanted: 0.0
variable_t6_wanted: 0.0
variable_t7_wanted: 0.0
variable_t8_wanted: 0.0
variable_t9_wanted: 0.0
gcode:

# ---------------------------------------------------------------------------
# The tool commands
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_T]
description: Mount tool T (internal, called by T0 ... T9)
gcode:
    {% set n = params.T|int %}
    {% set tc = printer.toolchanger %}
    {% if n not in tc.tool_numbers %}
        _MOSAIC_ECHO TYPE=warning MSG="T{n} ignored, tool {n} is not configured."
    {% else %}
        {% set cur = tc.tool_number|int %}
        {% if cur != n %}
            M400
            _MOSAIC_LOG_BEGIN T={n} FROM={cur}
            {% if cur >= 0 %}
                _MOSAIC_TOOL_LEAVE T={cur}
            {% endif %}
            {% if params.RESTORE_AXIS is defined %}
                SELECT_TOOL T={n} RESTORE_AXIS={params.RESTORE_AXIS}
            {% else %}
                SELECT_TOOL T={n}
            {% endif %}
            _MOSAIC_APPLY_GCODE_OFFSET
            _MOSAIC_TOOL_ENTER T={n}
            M400
            _MOSAIC_LOG_END T={n}
        {% endif %}
    {% endif %}

[gcode_macro _MOSAIC_TOOL_LEAVE]
description: Handle the heater of the tool that is put away (internal)
gcode:
    {% set n = params.T|int %}
    {% set st = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] %}
    {% set hn = printer[printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(n)]].heater %}
    {% if st.standby_mode|string|lower == 'standby' and hn and printer[hn] is defined %}
        {% set target = printer[hn].target|float %}
        {% if target > st.standby_temp|float %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_TOOLS_STATE VARIABLE=t{n}_wanted VALUE={target}
            SET_TOOL_TEMPERATURE T={n} TARGET={st.standby_temp|float}
        {% endif %}
    {% endif %}

[gcode_macro _MOSAIC_TOOL_ENTER]
description: Bring the heater of the newly mounted tool back and update the state (internal)
gcode:
    {% set n = params.T|int %}
    {% set st = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] %}
    {% set tstate = printer["gcode_macro _MOSAIC_TOOLS_STATE"] %}
    {% set hn = printer[printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(n)]].heater %}
    {% for i in range(10) %}
        {% if printer["gcode_macro T" ~ i] is defined and printer["gcode_macro T" ~ i].active is defined %}
            SET_GCODE_VARIABLE MACRO=T{i} VARIABLE=active VALUE={'True' if i == n else 'False'}
        {% endif %}
    {% endfor %}
    {% if st.standby_mode|string|lower == 'standby' and hn and printer[hn] is defined %}
        {% set wanted = tstate['t' ~ n ~ '_wanted']|default(0)|float %}
        {% if wanted > 0 and printer[hn].target|float == st.standby_temp|float %}
            SET_TOOL_TEMPERATURE T={n} TARGET={wanted} WAIT={1 if st.wait_on_select else 0}
        {% endif %}
    {% endif %}

[gcode_macro T0]
description: MOSAIC: mount tool 0
variable_active: False
gcode:
    _MOSAIC_T T=0 {rawparams}

[gcode_macro T1]
description: MOSAIC: mount tool 1
variable_active: False
gcode:
    _MOSAIC_T T=1 {rawparams}

[gcode_macro T2]
description: MOSAIC: mount tool 2
variable_active: False
gcode:
    _MOSAIC_T T=2 {rawparams}

[gcode_macro T3]
description: MOSAIC: mount tool 3
variable_active: False
gcode:
    _MOSAIC_T T=3 {rawparams}

[gcode_macro T4]
description: MOSAIC: mount tool 4
variable_active: False
gcode:
    _MOSAIC_T T=4 {rawparams}

[gcode_macro T5]
description: MOSAIC: mount tool 5
variable_active: False
gcode:
    _MOSAIC_T T=5 {rawparams}

[gcode_macro T6]
description: MOSAIC: mount tool 6
variable_active: False
gcode:
    _MOSAIC_T T=6 {rawparams}

[gcode_macro T7]
description: MOSAIC: mount tool 7
variable_active: False
gcode:
    _MOSAIC_T T=7 {rawparams}

[gcode_macro T8]
description: MOSAIC: mount tool 8
variable_active: False
gcode:
    _MOSAIC_T T=8 {rawparams}

[gcode_macro T9]
description: MOSAIC: mount tool 9
variable_active: False
gcode:
    _MOSAIC_T T=9 {rawparams}

# ---------------------------------------------------------------------------
# Temperatures
# ---------------------------------------------------------------------------
[gcode_macro MOSAIC_SET_TEMP]
description: Set the temperature of a tool. T= (default: the mounted tool) TARGET= WAIT=0|1
gcode:
    {% set tc = printer.toolchanger %}
    {% set st = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] %}
    {% set n = params.T|default(tc.tool_number)|int %}
    {% set target = params.TARGET|default(0)|float %}
    {% if n not in tc.tool_numbers %}
        _MOSAIC_ECHO TYPE=warning MSG="Temperature ignored, no tool {n}."
    {% else %}
        {% if target > st.standby_temp|float %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_TOOLS_STATE VARIABLE=t{n}_wanted VALUE={target}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_TOOLS_STATE VARIABLE=t{n}_wanted VALUE=0.0
        {% endif %}
        SET_TOOL_TEMPERATURE T={n} TARGET={target} WAIT={params.WAIT|default(0)|int}
    {% endif %}

[gcode_macro MOSAIC_TOOL_STANDBY]
description: Put a tool on the standby temperature. T= (default: the mounted tool)
gcode:
    {% set tc = printer.toolchanger %}
    {% set st = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] %}
    {% set n = params.T|default(tc.tool_number)|int %}
    {% if n not in tc.tool_numbers %}
        _MOSAIC_ECHO TYPE=warning MSG="Standby ignored, no tool {n}."
    {% else %}
        {% set hn = printer[tc.tool_names[tc.tool_numbers.index(n)]].heater %}
        {% set target = printer[hn].target|float if hn and printer[hn] is defined else 0.0 %}
        {% if target > st.standby_temp|float %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_TOOLS_STATE VARIABLE=t{n}_wanted VALUE={target}
        {% endif %}
        SET_TOOL_TEMPERATURE T={n} TARGET={st.standby_temp|float}
    {% endif %}

[gcode_macro MOSAIC_TOOLS_OFF]
description: Switch the heaters of all tools off
gcode:
    {% set tc = printer.toolchanger %}
    {% for n in tc.tool_numbers %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_TOOLS_STATE VARIABLE=t{n}_wanted VALUE=0.0
        SET_TOOL_TEMPERATURE T={n} TARGET=0
    {% endfor %}

[gcode_macro MOSAIC_TOOLS_STATUS]
description: List the tools with heater, temperature and fan
gcode:
    {% set tc = printer.toolchanger %}
    {% if tc.tool_numbers|length == 0 %}
        _MOSAIC_ECHO TYPE=warning MSG="No tools configured."
    {% endif %}
    {% for n in tc.tool_numbers %}
        {% set tool = printer[tc.tool_names[loop.index0]] %}
        {% set hn = tool.heater %}
        {% set temp = "%.1f / %.1f C" % (printer[hn].temperature|float, printer[hn].target|float) if hn and printer[hn] is defined else "no heater" %}
        {% set mark = "mounted" if tc.tool_number|int == n else "docked" %}
        {% set fil = (printer.save_variables.variables['t%d_filament' % n] if printer.save_variables is defined else {})|default({}, true) %}
        {% set ftxt = ("  " ~ fil.material|default('') ~ " " ~ fil.name|default('') ~ (" colour " ~ fil.color if fil.color else "")) if fil else "  no filament set" %}
        _MOSAIC_ECHO MSG="T{n} {mark} {temp}{ftxt}"
    {% endfor %}

# ---------------------------------------------------------------------------
# Filament per tool
# ---------------------------------------------------------------------------
# Saved in [save_variables] as t<N>_filament, for example
#   t2_filament = {'material': 'PETG', 'name': 'Galaxy Blue', 'color': '1E5AFF', 'temp': 240.0}
# The page shows it on the tool card and compares it with the colours a sliced
# file expects. Spoolman is not needed.
[gcode_macro MOSAIC_SET_FILAMENT]
description: Set the filament of a tool. T= (default: mounted tool) MATERIAL=PLA COLOR=RRGGBB (no hash sign) NAME="Galaxy Blue" TEMP=215, CLEAR=1 forgets it. Left-out values stay as they were.
gcode:
    {% set tc = printer.toolchanger %}
    {% set n = params.T|default(tc.tool_number)|int %}
    {% if n not in tc.tool_numbers %}
        _MOSAIC_ECHO TYPE=warning MSG="Filament ignored, no tool {n}."
    {% elif printer.save_variables is not defined %}
        _MOSAIC_ECHO TYPE=warning MSG="Filament ignored, it needs a [save_variables] section."
    {% elif params.CLEAR|default(0)|int == 1 %}
        SAVE_VARIABLE VARIABLE=t{n}_filament VALUE="{ {} }"
        _MOSAIC_ECHO MSG="T{n}: filament cleared."
    {% else %}
        {% set old = printer.save_variables.variables['t%d_filament' % n]|default({}, true) %}
        {% set material = params.MATERIAL|default(old.material|default(''))|string|replace('"', '')|replace("'", '')|replace('\\', '')|trim|upper %}
        {% set name = params.NAME|default(old.name|default(''))|string|replace('"', '')|replace("'", '')|replace('\\', '')|trim %}
        {% set color = params.COLOR|default(old.color|default(''))|string|trim|upper %}
        {% set temp = params.TEMP|default(old.temp|default(0))|float %}
        {% set hex_ok = color == '' or (color|length == 6 and color|list|reject('in', '0123456789ABCDEF')|list|length == 0) %}
        {% if not hex_ok %}
            _MOSAIC_ECHO TYPE=warning MSG="T{n}: COLOR must be 6 hex digits like FF8800, got {color}. Nothing saved."
        {% elif temp < 0 or temp > 500 %}
            _MOSAIC_ECHO TYPE=warning MSG="T{n}: TEMP {temp} is out of range. Nothing saved."
        {% else %}
            {% set fil = {'material': material[:20], 'name': name[:40], 'color': color, 'temp': temp} %}
            SAVE_VARIABLE VARIABLE=t{n}_filament VALUE="{fil}"
            _MOSAIC_ECHO MSG="T{n}: filament {material} {name} {('colour ' ~ color) if color else ''}"
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# Tool change log
# ---------------------------------------------------------------------------
# The T commands note the time of every change (with the heater wait in
# standby mode) and whether it worked: afterwards the tool must be the
# mounted one, and the carriage switch (head_switch), when there is one, must
# see a tool. A change that stopped with an error is logged as failed at the
# next change. Kept until Klipper restarts.
[gcode_macro _MOSAIC_LOG]
description: Tool change log of the MOSAIC T commands (internal). Not a command.
variable_entries: []
variable_pending: {}
variable_changes: 0
variable_failures: 0
variable_total_s: 0.0
gcode:

[gcode_macro _MOSAIC_LOG_BEGIN]
description: Start timing a tool change (internal). T= FROM=
gcode:
    {% set lg = printer["gcode_macro _MOSAIC_LOG"] %}
    {% set now = printer.toolhead.estimated_print_time|float %}
    {% if lg.pending %}
        {% set e = {'from': lg.pending['from'], 'to': lg.pending['to'], 's': -1.0, 'ok': False} %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=entries VALUE="{(lg.entries + [e])[-20:]}"
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=changes VALUE={lg.changes + 1}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=failures VALUE={lg.failures + 1}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=pending VALUE="{ {'from': params.FROM|int, 'to': params.T|int, 'start': now} }"

[gcode_macro _MOSAIC_LOG_END]
description: Finish timing a tool change (internal). T=
gcode:
    {% set lg = printer["gcode_macro _MOSAIC_LOG"] %}
    {% set n = params.T|int %}
    {% set p = lg.pending %}
    {% if p and p['to'] == n %}
        {% set dur = [printer.toolhead.estimated_print_time|float - p['start']|float, 0.0]|max %}
        {% set ts = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined else {} %}
        {% set head = printer["gcode_button " ~ (ts.head_switch|default('mosaic_head')|string|trim)] %}
        {% set head_ok = head is not defined or head.state == "PRESSED" %}
        {% set ok = printer.toolchanger.tool_number|int == n and head_ok %}
        {% set e = {'from': p['from'], 'to': n, 's': (dur * 10)|round / 10, 'ok': ok} %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=entries VALUE="{(lg.entries + [e])[-20:]}"
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=changes VALUE={lg.changes + 1}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=pending VALUE="{ {} }"
        {% if ok %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=total_s VALUE={lg.total_s + e.s}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=failures VALUE={lg.failures + 1}
            _MOSAIC_ECHO TYPE=warning MSG="T{n}: tool change finished but {'the carriage switch sees no tool' if not head_ok else 'T%d is not the mounted tool' % n}."
        {% endif %}
    {% endif %}

[gcode_macro MOSAIC_TOOL_LOG]
description: Print the last tool changes with time and result. RESET=1 clears the log.
gcode:
    {% set lg = printer["gcode_macro _MOSAIC_LOG"] %}
    {% if params.RESET|default(0)|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=entries VALUE="[]"
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=pending VALUE="{ {} }"
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=changes VALUE=0
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=failures VALUE=0
        SET_GCODE_VARIABLE MACRO=_MOSAIC_LOG VARIABLE=total_s VALUE=0.0
        _MOSAIC_ECHO MSG="Tool change log cleared."
    {% else %}
        {% set good = lg.changes - lg.failures %}
        {% set avg = (lg.total_s / good) if good > 0 else 0 %}
        _MOSAIC_ECHO MSG="{'%d tool changes, %d failed, %.1f s on average' % (lg.changes, lg.failures, avg)}"
        {% for e in lg.entries %}
            {% set src = ('T%d' % e['from']) if e['from'] >= 0 else 'none' %}
            _MOSAIC_ECHO MSG="{'%s -> T%d  %s  %s' % (src, e['to'], ('%.1f s' % e.s) if e.s >= 0 else '-', 'ok' if e.ok else 'FAILED')}"
        {% endfor %}
    {% endif %}
