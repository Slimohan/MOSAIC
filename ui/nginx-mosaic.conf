# MOSAIC page inside Mainsail's web server, at http://<printer>/mosaic/
# install.sh adds an include for this file to Mainsail's nginx site.
location = /mosaic {
    return 301 /mosaic/;
}
location /mosaic/ {
    proxy_pass http://127.0.0.1:8099/;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
}
