# MOSAIC page inside the web server of Mainsail or Fluidd, at http://<printer>/mosaic/
# install.sh adds an include for this file to the nginx site of Mainsail and/or Fluidd.
location = /mosaic {
    # relative Location: behind an HTTPS reverse proxy an absolute one would point at http://
    absolute_redirect off;
    return 301 /mosaic/;
}
location /mosaic/ {
    proxy_pass http://127.0.0.1:8099/;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
}
