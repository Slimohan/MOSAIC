<style>
  :root { --bg:#14171a; --fg:#e8eaed; --mute:#9aa0a6; --card:#1f2428; --line:#3a4046; --acc:#4da3ff; --ok:#3ecf6e; --bad:#ff5d5d; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --fg:#1b1f23; --mute:#5b636b; --card:#fff; --line:#d0d5da; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  h1 { font-size:18px; margin:0 0 4px; } h2 { font-size:14px; margin:0 0 10px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
  button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:var(--acc); } button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:600; }
  button.warn { border-color:var(--bad); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
  label { color:var(--mute); font-size:13px; }
  select, input { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  input[type=text], input[type=number] { width:110px; }
  #status { font-size:13px; color:var(--mute); min-height:1.4em; }
  #status.err { color:var(--bad); } #status.ok { color:var(--ok); }
  table { border-collapse:collapse; width:100%; font-size:13px; } td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; border:1px solid var(--line); }
  .pill.on { border-color:var(--ok); color:var(--ok); }
  nav.tabs { max-width:960px; margin:0 auto; padding:16px 16px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  nav.tabs h1 { margin:0 12px 0 0; }
  nav.tabs button.tab { border-radius:20px; }
  nav.tabs button.tab.sel { background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:600; }
  .hidden { display:none !important; }
  #tab_tools { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .cards { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; display:grid; gap:8px; align-content:start; }
  .card.mounted { border-color:var(--ok); }
  .card h3 { margin:0; font-size:16px; display:flex; justify-content:space-between; align-items:center; }
  .card .temp { font-size:20px; font-variant-numeric:tabular-nums; }
  .card .temp small { color:var(--mute); font-size:13px; }
  .card .mini { font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; }
  .card .row { margin:0; gap:6px; }
  .card button { padding:5px 9px; font-size:13px; }
  .card input[type=number] { width:56px; padding:4px 5px; }
  .card .row button { padding:5px 7px; }
  .card input[type=range] { width:100%; }
  .pill.hot { border-color:#ff9f43; color:#ff9f43; }
  .pill.dock { color:var(--mute); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .note { color:var(--mute); font-size:13px; }
  ol { margin:0; padding-left:20px; color:var(--mute); font-size:13px; }
</style>
</head>

<div id="tab_tools">
  <section>
    <div class="bar">
      <button id="g_off" class="warn">All heaters off</button>
      <button id="g_status">Print tool list to console</button>
      <span class="pill" id="g_bed">bed -</span>
    </div>
    <div class="note" id="g_note"></div>
  </section>
  <div class="cards" id="cards"></div>
  <section>
    <h2>Calibration</h2>
    <div class="bar">
      <button class="primary" id="c_all">Calibrate all tools</button>
      <button id="c_xy">X and Y only</button>
      <button id="c_z">Z only</button>
      <label>at <input type="number" id="c_temp" min="0" max="350" step="5" value="0" style="width:70px"> &deg;C (0 = cold)</label>
    </div>
    <div class="note" style="margin-top:8px">Every nozzle touches the Nudge probe and the offsets are saved by themselves. Make sure the bed is clear and the nozzles are clean. A card has its own <b>Calibrate</b> button for a single tool. The printer must be homed.</div>

      <button id="b_nq">Nudge probe state</button>

  </section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let busy = false;

function say(msg, cls) { const s = $("status"); s.textContent = msg; s.className = cls || ""; }

async function api(path, opts) {
  const r = await fetch("/moonraker" + path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && (j.error.message || j.error)) || ("HTTP " + r.status));
  return j;
}

async function gcode(script, label) {
  if (busy) return;
  busy = true; document.body.style.cursor = "progress";
  say((label || script) + " ...");
  try {
    await api("/printer/gcode/script?script=" + encodeURIComponent(script), { method: "POST", body: "{}" });
    say((label || script) + ": done", "ok");
  } catch (e) { say(String(e.message || e), "err"); }
  busy = false; document.body.style.cursor = ""; refresh();
}

$("b_zq").onclick = () => gcode("MOSAIC_Z_QUERY", "Z switch state");
$("b_nq").onclick = () => gcode("MOSAIC_NUDGE_QUERY", "Nudge probe state");
$("b_check").onclick = () => gcode("MOSAIC_CHECK", "Check set-up");
$("b_echo").onclick = () => gcode("MOSAIC_ECHO_OFFSETS", "Print offsets");
$("b_apply").onclick = () => gcode("MOSAIC_APPLY_OFFSETS", "Reload offsets");

function calTemp() { const t = parseFloat($("c_temp").value) || 0; return t > 0 ? " TEMP=" + t : ""; }
$("c_all").onclick = () => gcode("MOSAIC_CALIBRATE" + calTemp(), "Calibrate all tools");
$("c_xy").onclick = () => gcode("MOSAIC_CALIBRATE_XY" + calTemp(), "Calibrate X and Y");
$("c_z").onclick = () => gcode("MOSAIC_CALIBRATE_Z" + calTemp(), "Calibrate Z");

function td(t) { const e = document.createElement("td"); e.textContent = t; return e; }

// ---------------------------------------------------------------- state
let toolNames = [];        // e.g. ["tool T0", ...], learned from the toolchanger
let hasMosaicTools = false;  // mosaic_tools.cfg is loaded
let refTool = 0;
let cardKey = "";
const cards = {};          // tool number -> element references

const q = objs => "/printer/objects/query?" + objs.map(encodeURIComponent).join("&");
const fmt = v => (v === undefined || v === null || isNaN(v)) ? "-" : Number(v).toFixed(1);

function cmdMount(n) { return hasMosaicTools ? "T" + n : "SELECT_TOOL T=" + n; }
function cmdTemp(n, t) { return (hasMosaicTools ? "MOSAIC_SET_TEMP T=" + n + " TARGET=" : "SET_TOOL_TEMPERATURE T=" + n + " TARGET=") + t; }
function cmdStandby(n) { return hasMosaicTools ? "MOSAIC_TOOL_STANDBY T=" + n : "SET_TOOL_TEMPERATURE T=" + n + " TARGET=0"; }

function calibrateTool(n) {
  if (n === refTool) { say("T" + n + " is the reference tool, it has no offsets to measure.", "ok"); return; }
  gcode("MOSAIC_CALIBRATE TOOL=" + n + calTemp(), "Calibrate T" + n);
}

function btn(text, fn, cls) { const b = document.createElement("button"); b.textContent = text; if (cls) b.className = cls; b.onclick = fn; return b; }

function buildCards(nums) {
  const box = $("cards"); box.textContent = ""; for (const k in cards) delete cards[k];
  nums.forEach(n => {
    const el = document.createElement("div"); el.className = "card";
    const h = document.createElement("h3");
    const title = document.createElement("span"); title.textContent = "T" + n;
    const where = document.createElement("span"); where.className = "pill dock"; where.textContent = "docked";
    h.append(title, where);
    const temp = document.createElement("div"); temp.className = "temp";
    const cur = document.createElement("span"); const tgt = document.createElement("small");
    const state = document.createElement("span"); state.className = "pill"; state.style.marginLeft = "8px";
    temp.append(cur, tgt, state);
    const row1 = document.createElement("div"); row1.className = "row";
    const inp = document.createElement("input"); inp.type = "number"; inp.min = 0; inp.max = 350; inp.step = 5; inp.placeholder = "°C";
    const setTemp = () => {
      const v = parseFloat(inp.value);
      if (!(v >= 0)) { say("Enter a temperature for T" + n + ".", "err"); return; }
      gcode(cmdTemp(n, v), "T" + n + " to " + v + " °C");
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") setTemp(); });
    row1.append(inp, btn("Set", setTemp, "primary"), btn("Standby", () => gcode(cmdStandby(n), "T" + n + " standby")),
                btn("Off", () => gcode(cmdTemp(n, 0), "T" + n + " off")));
    const fanRow = document.createElement("div");
    const fanLabel = document.createElement("div"); fanLabel.className = "mini";
    const fan = document.createElement("input"); fan.type = "range"; fan.min = 0; fan.max = 100; fan.step = 5; fan.value = 0;
    fan.addEventListener("input", () => { fanLabel.textContent = "Fan " + fan.value + " %"; });
    fan.addEventListener("change", () => gcode("M106 S" + Math.round(fan.value * 2.55) + " T" + n, "T" + n + " fan " + fan.value + " %"));
    fanRow.append(fanLabel, fan);
    const off = document.createElement("div"); off.className = "mini";
    const row2 = document.createElement("div"); row2.className = "row";
    const mount = btn("Mount", () => gcode(cmdMount(n), "Mount T" + n), "primary");
    const dock = btn("Dock", () => gcode("UNSELECT_TOOL", "Dock T" + n));
    const cal = btn("Calibrate", () => calibrateTool(n));
    row2.append(mount, dock, cal);
    el.append(h, temp, row1, fanRow, off, row2);
    box.appendChild(el);
    cards[n] = { el, where, cur, tgt, state, inp, fan, fanLabel, fanRow, off, mount, dock };
  });
}

function stateOf(t, g) {
  if (g > 0) return Math.abs(t - g) <= 3 ? ["ready", "on"] : (t < g ? ["heating", "hot"] : ["cooling", "hot"]);
  return t > 50 ? ["cooling", "hot"] : ["off", ""];
}

function updateCards(o, nums, v) {
  const tc = o.toolchanger || {};
  nums.forEach((n, idx) => {
    const c = cards[n]; if (!c) return;
    const ts = o[toolNames[idx]] || {};
    const mounted = n === tc.tool_number;
    c.el.classList.toggle("mounted", mounted);
    c.where.textContent = mounted ? "mounted" : "docked";
    c.where.className = "pill " + (mounted ? "on" : "dock");
    c.mount.disabled = mounted; c.dock.disabled = !mounted;
    const h = ts.heater && o[ts.heater];
    if (h) {
      c.cur.textContent = fmt(h.temperature);
      c.tgt.textContent = " / " + fmt(h.target) + " °C";
      const [txt, cls] = stateOf(Number(h.temperature), Number(h.target));
      c.state.textContent = txt; c.state.className = "pill " + cls;
      c.inp.placeholder = Number(h.target) > 0 ? String(Math.round(h.target)) : "\u00b0C";
    } else {
      c.cur.textContent = "no heater"; c.tgt.textContent = ""; c.state.textContent = ""; c.state.className = "pill";
    }
    const f = ts.fan && (o[ts.fan] || o["fan_generic " + ts.fan]);
    c.fanRow.classList.toggle("hidden", !ts.fan);
    if (f && document.activeElement !== c.fan) {
      c.fan.value = Math.round((f.speed || 0) * 100); c.fanLabel.textContent = "Fan " + c.fan.value + " %";
    } else if (!f && ts.fan) { c.fanLabel.textContent = "Fan"; }
    const xyz = ["x", "y", "z"].map(a => { const val = v["t" + n + "_offset_" + a]; return a.toUpperCase() + " " + (val === undefined ? "-" : Number(val).toFixed(3)); });
    c.off.textContent = "Offset " + xyz.join("  ");
  });
}

async function refresh() {
  try {
    const base = ["toolchanger", "save_variables", "gcode_macro _MOSAIC_STATE", "gcode_macro _MOSAIC_SETTINGS",
                  "gcode_macro _MOSAIC_TOOLS_SETTINGS", "mosaic_z_probe", "heater_bed", "toolhead"].concat(toolNames);
    const j = await api(q(base));
    const o = j.result.status;
    const tc = o.toolchanger || {};
    const nums = tc.tool_numbers || [];
    const names = tc.tool_names || [];
    // objects of the tools: heater and fan names are in their status
    if (names.join("|") !== toolNames.join("|")) { toolNames = names.slice(); return refresh(); }
    const extra = [];
    toolNames.forEach(nm => { const t = o[nm]; if (t) { if (t.heater) extra.push(t.heater); if (t.fan) { extra.push(t.fan); extra.push("fan_generic " + t.fan); } } });
    if (extra.length) { const j2 = await api(q(Array.from(new Set(extra)))); Object.assign(o, j2.result.status); }

    const st = o["gcode_macro _MOSAIC_SETTINGS"];
    refTool = st && st.reference_tool !== undefined ? Number(st.reference_tool) : 0;
    hasMosaicTools = !!o["gcode_macro _MOSAIC_TOOLS_SETTINGS"];
    $("g_note").textContent = hasMosaicTools ? "" :
      "mosaic_tools.cfg is not loaded: the buttons use SELECT_TOOL and SET_TOOL_TEMPERATURE, there are no T0 ... T9 macros and no standby handling.";

    $("b_zq").classList.toggle("hidden", !o.mosaic_z_probe);
    const v = (o.save_variables && o.save_variables.variables) || {};
    const ck = nums.join(",");
    if (ck !== cardKey) { cardKey = ck; buildCards(nums); }
    updateCards(o, nums, v);
    const bed = o.heater_bed;
    $("g_bed").textContent = bed ? "bed " + fmt(bed.temperature) + " / " + fmt(bed.target) + " °C" : "no bed";

    const t = $("offsets"); t.textContent = "";
    const h = document.createElement("tr"); ["Tool", "X", "Y", "Z"].forEach(x => { const e = document.createElement("th"); e.textContent = x; h.appendChild(e); }); t.appendChild(h);
    nums.forEach(n => {
      const r = document.createElement("tr");
      r.appendChild(td("T" + n));
      ["x", "y", "z"].forEach(a => { const val = v["t" + n + "_offset_" + a]; r.appendChild(td(val === undefined ? "-" : Number(val).toFixed(3))); });
      t.appendChild(r);
    });
    if (!busy && $("status").textContent === "Connecting...") say("Ready.", "ok");
  } catch (e) { if (!busy) say("Cannot reach Klipper: " + e.message, "err"); }
}

$("g_off").onclick = () => {
  const nums = Object.keys(cards).map(Number);
  gcode(hasMosaicTools ? "MOSAIC_TOOLS_OFF" : nums.map(n => "SET_TOOL_TEMPERATURE T=" + n + " TARGET=0").join("\n"), "All tool heaters off");
};
$("g_status").onclick = () => gcode(hasMosaicTools ? "MOSAIC_TOOLS_STATUS" : "MOSAIC_ECHO_OFFSETS", "Tool list");

refresh(); setInterval(() => { if (!busy) refresh(); }, 3000);
</script>
</body>
</html>
