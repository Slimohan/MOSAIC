# MOSAIC: the T5 command (mount tool 5). Loaded by core/mosaic_tools.cfg together
# with T0 ... T9, or on its own (section 1 of mosaic.cfg), after core/mosaic_tools_core.cfg.
[gcode_macro T5]
description: MOSAIC: mount tool 5
# True while this tool is mounted (for frontends)
variable_active: False
# Spoolman spool of this tool, None = none. Mainsail's Spoolman panel shows and sets it
# per tool; MOSAIC keeps it in step with the filament of the tool (t5_filament).
variable_spool_id: None
gcode:
    _MOSAIC_T T=5 {rawparams}
