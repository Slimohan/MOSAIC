# VRTX: the T4 command (mount tool 4). Loaded by core/vrtx_tools.cfg together
# with T0 ... T9, or on its own (section 1 of vrtx.cfg), after core/vrtx_tools_core.cfg.
[gcode_macro T4]
description: VRTX: mount tool 4
# True while this tool is mounted (for frontends)
variable_active: False
# Spoolman spool of this tool, None = none. Mainsail's Spoolman panel shows and sets it
# per tool; VRTX keeps it in step with the filament of the tool (t4_filament).
variable_spool_id: None
gcode:
    _VRTX_T T=4 {rawparams}
