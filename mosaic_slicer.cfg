# mosaic_slicer.cfg  (OPTIONAL, needs mosaic_tools.cfg)
#
# The slicer's tool commands with a T parameter, for multi tool prints:
#
#   M104 T1 S220     set tool 1, do not wait
#   M109 T1 S220     set tool 1 and wait
#   M104 S210        no T: the mounted tool
#   M106 T1 S255     part fan of tool 1 (M107 T1: off; P1 works like T1)
#
# All of them follow the MOSAIC tool map (MOSAIC_TOOL_MAP): with T0 mapped to
# T3, "M104 T0 S215" heats tool 3. Without this file only the T0 ... T9
# commands follow the map, so switch it on (00_core.cfg) when you use a map.
#
# klipper-toolchanger does not give M104 a T parameter, and Klipper's own M104
# only knows [extruder] heaters, so without this file a tool with a
# heater_generic hotend cannot be heated by a slicer line either.
#
# M106 / M107 wrap the command that is already there (klipper-toolchanger's
# tool fans, or Klipper's [fan]); a printer without any fan cannot load this file.
#
# Without a T parameter and without a mounted tool the original command runs on
# the [extruder] as before.
#
# Do not include it together with beacon_heater_hooks.cfg from the Beacon macros.
# Both define [gcode_macro M104] and [gcode_macro M109]. Klipper does not complain,
# it merges sections with the same name and the file included last silently wins.
# This file calls _BEACON_UPDATE_NOZZLE_TEMP_OFFSET itself when the Beacon macros
# are loaded, so you lose nothing by leaving the Beacon file out.
# Note that the Beacon offset follows the [extruder] named in _BEACON_SETTINGS,
# not the heater of the mounted tool.
#
# Klipper strips everything after a hash sign on every line, so comments in
# this file are always whole lines.

[gcode_macro M104]
rename_existing: M104.1
description: Set the tool temperature, T= selects the tool (MOSAIC)
gcode:
    {% set tc = printer.toolchanger %}
    {% set mp = (printer.save_variables.variables.mosaic_tool_map if printer.save_variables is defined else {})|default({}, true) %}
    {% set n = (mp[params.T|int]|default(params.T|int)) if params.T is defined else tc.tool_number|int %}
    {% if params.S is not defined %}
        {% set s = -1.0 %}
    {% else %}
        {% set s = params.S|float %}
    {% endif %}
    {% if s >= 0 %}
        {% if n >= 0 and n in tc.tool_numbers %}
            MOSAIC_SET_TEMP T={n} TARGET={s}
        {% elif params.T is defined %}
            _MOSAIC_ECHO TYPE=warning MSG="M104 T{params.T} ignored, tool {n} is not configured."
        {% else %}
            M104.1 {rawparams}
        {% endif %}
        {% if printer["gcode_macro _BEACON_UPDATE_NOZZLE_TEMP_OFFSET"] is defined %}
            _BEACON_UPDATE_NOZZLE_TEMP_OFFSET
        {% endif %}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: Set the tool temperature and wait, T= selects the tool (MOSAIC)
gcode:
    {% set tc = printer.toolchanger %}
    {% set mp = (printer.save_variables.variables.mosaic_tool_map if printer.save_variables is defined else {})|default({}, true) %}
    {% set n = (mp[params.T|int]|default(params.T|int)) if params.T is defined else tc.tool_number|int %}
    {% if params.S is defined %}
        {% set s = params.S|float %}
    {% elif params.R is defined %}
        {% set s = params.R|float %}
    {% else %}
        {% set s = -1.0 %}
    {% endif %}
    {% if s >= 0 %}
        {% if n >= 0 and n in tc.tool_numbers %}
            MOSAIC_SET_TEMP T={n} TARGET={s} WAIT=0
            {% if printer["gcode_macro _BEACON_UPDATE_NOZZLE_TEMP_OFFSET"] is defined %}
                _BEACON_UPDATE_NOZZLE_TEMP_OFFSET
            {% endif %}
            {% if s > 0 %}
                SET_TOOL_TEMPERATURE T={n} TARGET={s} WAIT=1
            {% endif %}
        {% elif params.T is defined %}
            _MOSAIC_ECHO TYPE=warning MSG="M109 T{params.T} ignored, tool {n} is not configured."
        {% else %}
            M109.1 {rawparams}
        {% endif %}
    {% endif %}

[gcode_macro M106]
rename_existing: M106.1
description: Set the part fan, T (or P) selects the tool and follows the MOSAIC tool map
gcode:
    {% set raw_t = params.T if params.T is defined else params.P %}
    {% if raw_t is defined %}
        {% set mp = (printer.save_variables.variables.mosaic_tool_map if printer.save_variables is defined else {})|default({}, true) %}
        {% set n = mp[raw_t|int]|default(raw_t|int)|int %}
        M106.1 S{params.S|default(255)} T{n}
    {% else %}
        M106.1 {rawparams}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
description: Switch the part fan off, T (or P) selects the tool and follows the MOSAIC tool map
gcode:
    {% set raw_t = params.T if params.T is defined else params.P %}
    {% if raw_t is defined %}
        {% set mp = (printer.save_variables.variables.mosaic_tool_map if printer.save_variables is defined else {})|default({}, true) %}
        {% set n = mp[raw_t|int]|default(raw_t|int)|int %}
        M107.1 T{n}
    {% else %}
        M107.1 {rawparams}
    {% endif %}
