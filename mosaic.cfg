# mosaic.cfg
#
# MOSAIC: Multi-Tool Offset Alignment & Integrated Calibration.
#
# Camera and switch based tool alignment in the style of the RatRig VAOC, for tool changers that
# use klipper-toolchanger (such as MadMax), running on stock Klipper or Kalico.
#
#   XY: a camera looks up at the nozzle. You centre every nozzle in the
#       crosshair (web page in ui/, or the console), the macros turn that into
#       X and Y tool offsets.
#   Z:  a switch next to the camera. Every nozzle presses it and the macros
#       turn the trigger heights into Z tool offsets.
#
# Based on the VAOC macros of RatOS (GPL-3.0), rewritten for tool changers that
# use klipper-toolchanger. See README.md.
#
# Include from printer.cfg:
#
#   [include mosaic/mosaic.cfg]
#
# Change settings by repeating [gcode_macro _MOSAIC_SETTINGS] in printer.cfg AFTER
# the include and listing only the variables you want to change.
#
# Klipper strips everything after a hash sign on every line, so comments in
# this file are always whole lines.

[gcode_macro _MOSAIC_SETTINGS]
description: Settings of the MOSAIC tool alignment. Not a command.
# Which tool is the reference, normally T0. Its offsets are the base for all others.
variable_reference_tool: 0
# How tool offsets reach Klipper.
#   tool_parameter: for klipper-toolchanger from 2025.12.26 on. The offsets are the
#                   gcode_x_offset, gcode_y_offset and gcode_z_offset parameters of
#                   the tools. They are applied from the saved variables at startup.
#   gcode_offset:   for configs that apply offsets with SET_GCODE_OFFSET after every
#                   tool change, like the r2pdx MadMax configs. They read the
#                   t<N>_offset_x/y/z variables that this macro set also writes.
variable_offset_method: 'tool_parameter'
# Approximate position of the camera centre in gcode coordinates. The first
# session starts here, the exact position is saved when you set the reference tool.
variable_camera_x: 100.0
variable_camera_y: 30.0
# Nozzle height in gcode coordinates where the nozzle tip is in focus.
# The exact height is saved when you set the reference tool.
variable_focus_z: 8.0
# Z for travel moves between the camera, the switch and the tool docks.
# It must be higher than everything on the bed, the MOSAIC housing included.
variable_safe_z: 30.0
# Speeds in mm/s
variable_travel_speed: 200.0
variable_z_speed: 10.0
# Largest single move of MOSAIC_MOVE in mm
variable_xy_move_limit: 2.0
variable_z_move_limit: 1.0
# Z switch: coarse search speed from safe_z downwards, and the lowest Z that the
# search may reach. The switch has to be above this height.
variable_z_coarse_speed: 5.0
variable_z_search_min: 0.0
# Z switch: lift in mm between the coarse search and the measurement
variable_z_coarse_lift: 2.0
# Nozzle temperature for the Z measurement in C. 0 measures cold.
# Measuring hot includes the thermal expansion of each hotend, but a hot nozzle
# needs clean filament-free tips.
variable_z_cal_temp: 0
# Largest sample spread in mm of the switch that is accepted without a warning
variable_z_range_warning: 0.02
# LED ring brightness 0.0 to 1.0, only used when a [neopixel mosaic_led] exists
variable_led_brightness: 1.0
# Camera cooling: part cooling fan speed 0.0 to 1.0 of the tool in front of the
# camera when the bed is hotter than the given temperature. 0 disables it.
variable_camera_cooling_fan_speed: 0.0
variable_camera_cooling_bed_temp: 50
gcode:

[gcode_macro _MOSAIC_STATE]
description: Internal state of the MOSAIC macros. Not a command.
variable_active: False
variable_z_ref: 0.0
variable_z_ref_offset: 0.0
gcode:

[gcode_macro _MOSAIC_ECHO]
description: Console output. MSG=text, TYPE=info|warning
gcode:
    {% set text = params.MSG|default("")|replace('"', "'") %}
    {% if params.TYPE|default("info")|lower == "warning" %}
        { action_respond_info("MOSAIC WARNING: " ~ text) }
    {% else %}
        { action_respond_info("MOSAIC: " ~ text) }
    {% endif %}

[gcode_macro _MOSAIC_LED]
description: Switch the MOSAIC LED ring. STATE=ON|OFF
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% if printer["neopixel mosaic_led"] is defined %}
        {% set b = s.led_brightness|float if params.STATE|default("ON")|upper == "ON" else 0.0 %}
        SET_LED LED=mosaic_led RED={b} GREEN={b} BLUE={b} TRANSMIT=1
    {% endif %}

# ---------------------------------------------------------------------------
# Small building blocks. They are separate macros because a macro reads the
# printer state when it starts, not when its lines run.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_SELECT]
description: Mount tool T. In gcode_offset mode also apply its saved offsets (internal)
gcode:
    SELECT_TOOL T={params.T|int}
    _MOSAIC_APPLY_GCODE_OFFSET

[gcode_macro _MOSAIC_APPLY_GCODE_OFFSET]
description: gcode_offset mode: set the G-code offset of the mounted tool from the saved variables (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set n = printer.toolchanger.tool_number|int %}
    {% if s.offset_method|string|lower == 'gcode_offset' and n >= 0 %}
        SET_GCODE_OFFSET X={svv['t' ~ n ~ '_offset_x']|default(0)|float} Y={svv['t' ~ n ~ '_offset_y']|default(0)|float} Z={svv['t' ~ n ~ '_offset_z']|default(0)|float}
    {% endif %}

[gcode_macro _MOSAIC_SAFE_Z]
description: Raise to safe_z unless already higher
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% if printer.gcode_move.gcode_position.z|float < s.safe_z|float %}
        G90
        G1 Z{s.safe_z|float} F{s.z_speed|float * 60}
    {% endif %}

[gcode_macro _MOSAIC_GOTO_CAMERA]
description: Move to the saved camera position and the focus height
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set cx = svv.mosaic_ref_x|default(s.camera_x)|float %}
    {% set cy = svv.mosaic_ref_y|default(s.camera_y)|float %}
    {% set cz = svv.mosaic_ref_z|default(s.focus_z)|float %}
    _MOSAIC_SAFE_Z
    G90
    G1 X{cx} Y{cy} F{s.travel_speed|float * 60}
    G1 Z{cz} F{s.z_speed|float * 60}

[gcode_macro _MOSAIC_CAMERA_COOLING]
description: Run the part cooling fan of tool T when the bed is hot. T=-1 stops all fans
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set t = params.T|default(-1)|int %}
    {% set speed = s.camera_cooling_fan_speed|float %}
    {% if speed > 0 and printer.heater_bed is defined %}
        {% for n in printer.toolchanger.tool_numbers %}
            {% if n == t and printer.heater_bed.temperature|float >= s.camera_cooling_bed_temp|float %}
                M106 S{(speed * 255)|int} T{n}
            {% else %}
                M107 T{n}
            {% endif %}
        {% endfor %}
    {% endif %}

# ---------------------------------------------------------------------------
# Offsets in the save file and in Klipper
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_STORE_OFFSET]
description: Save the offset of tool T and hand it to Klipper. T= X= Y= Z=
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set t = params.T|int %}
    {% set method = s.offset_method|string|lower %}
    {% set vx = params.X|float|round(3) %}
    {% set vy = params.Y|float|round(3) %}
    {% set vz = params.Z|float|round(3) %}
    SAVE_VARIABLE VARIABLE=t{t}_offset_x VALUE={vx}
    SAVE_VARIABLE VARIABLE=t{t}_offset_y VALUE={vy}
    SAVE_VARIABLE VARIABLE=t{t}_offset_z VALUE={vz}
    {% if method == 'tool_parameter' %}
        SET_TOOL_PARAMETER T={t} PARAMETER=gcode_x_offset VALUE={vx}
        SET_TOOL_PARAMETER T={t} PARAMETER=gcode_y_offset VALUE={vy}
        SET_TOOL_PARAMETER T={t} PARAMETER=gcode_z_offset VALUE={vz}
    {% endif %}

[gcode_macro MOSAIC_APPLY_OFFSETS]
description: Load the saved offsets into the tools (offset_method tool_parameter). Runs at startup.
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set svv = printer.save_variables.variables %}
    {% if s.offset_method|string|lower == 'tool_parameter' and printer.toolchanger is defined %}
        {% for n in printer.toolchanger.tool_numbers %}
            {% if svv['t' ~ n ~ '_offset_x'] is defined %}
                SET_TOOL_PARAMETER T={n} PARAMETER=gcode_x_offset VALUE={svv['t' ~ n ~ '_offset_x']|float}
                SET_TOOL_PARAMETER T={n} PARAMETER=gcode_y_offset VALUE={svv['t' ~ n ~ '_offset_y']|default(0)|float}
                SET_TOOL_PARAMETER T={n} PARAMETER=gcode_z_offset VALUE={svv['t' ~ n ~ '_offset_z']|default(0)|float}
            {% endif %}
        {% endfor %}
        _MOSAIC_ECHO MSG="Tool offsets loaded."
    {% endif %}

[delayed_gcode _MOSAIC_STARTUP]
initial_duration: 2.0
gcode:
    MOSAIC_APPLY_OFFSETS

[gcode_macro MOSAIC_ECHO_OFFSETS]
description: Show the saved tool offsets and the camera reference
gcode:
    {% set svv = printer.save_variables.variables if printer.save_variables is defined else {} %}
    {% if printer.toolchanger is not defined %}
        _MOSAIC_ECHO TYPE=warning MSG="klipper-toolchanger is not configured."
    {% else %}
        {% for n in printer.toolchanger.tool_numbers %}
            { action_respond_info("MOSAIC: T%d offset X %.3f  Y %.3f  Z %.3f" % (n, svv['t' ~ n ~ '_offset_x']|default(0)|float, svv['t' ~ n ~ '_offset_y']|default(0)|float, svv['t' ~ n ~ '_offset_z']|default(0)|float)) }
        {% endfor %}
        {% if svv.mosaic_ref_x is defined %}
            { action_respond_info("MOSAIC: reference camera position X %.3f  Y %.3f  focus Z %.3f" % (svv.mosaic_ref_x|float, svv.mosaic_ref_y|float, svv.mosaic_ref_z|float)) }
        {% else %}
            { action_respond_info("MOSAIC: no reference position saved yet, run MOSAIC_START and MOSAIC_SET_TOOL on the reference tool.") }
        {% endif %}
    {% endif %}

[gcode_macro MOSAIC_RESET_OFFSETS]
description: Set the offsets of tool T to zero. Without T all tools except the reference tool. The tool must not be mounted.
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set ref = s.reference_tool|int %}
    {% set only = params.T|default(-1)|int %}
    {% set active = printer.toolchanger.tool_number|int %}
    {% set ns = namespace(err="") %}
    {% for n in printer.toolchanger.tool_numbers %}
        {% if ((only == -1 and n != ref) or only == n) and n == active %}
            {% set ns.err = "T" ~ n ~ " is mounted. Select another tool before resetting its offsets." %}
        {% endif %}
    {% endfor %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was reset."
    {% else %}
        {% for n in printer.toolchanger.tool_numbers %}
            {% if (only == -1 and n != ref) or only == n %}
                _MOSAIC_STORE_OFFSET T={n} X=0 Y=0 Z=0
            {% endif %}
        {% endfor %}
        _MOSAIC_ECHO MSG="Offsets reset."
    {% endif %}

# ---------------------------------------------------------------------------
# XY alignment with the camera
# ---------------------------------------------------------------------------
[gcode_macro MOSAIC_START]
description: Start the camera alignment. Moves the reference tool over the camera. RESET=1 zeroes the XY and Z offsets of the other tools first.
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_STATE"] %}
    {% set method = s.offset_method|string|lower %}
    {% set ref = s.reference_tool|int %}
    {% set ns = namespace(err="") %}
    {% if st.active|string|lower == 'true' %}
        {% set ns.err = "A MOSAIC session is already running. Finish it with MOSAIC_END." %}
    {% elif printer.toolchanger is not defined %}
        {% set ns.err = "klipper-toolchanger is not configured." %}
    {% elif printer.save_variables is not defined %}
        {% set ns.err = "A [save_variables] section is required." %}
    {% elif ref not in printer.toolchanger.tool_numbers %}
        {% set ns.err = "The reference tool T" ~ ref ~ " does not exist." %}
    {% elif printer.toolhead.homed_axes != "xyz" %}
        {% set ns.err = "Home all axes first." %}
    {% elif method not in ['tool_parameter', 'gcode_offset'] %}
        {% set ns.err = "offset_method in _MOSAIC_SETTINGS must be tool_parameter or gcode_offset." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was done."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_STATE VARIABLE=active VALUE=True
        _MOSAIC_START_PREPARE
        {% if params.RESET|default(0)|int == 1 %}
            _MOSAIC_START_RESET
        {% endif %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={ref}
        _MOSAIC_GOTO_CAMERA
        _MOSAIC_LED STATE=ON
        _MOSAIC_CAMERA_COOLING T={ref}
        _MOSAIC_ECHO MSG="Session started with T{ref}. Centre the nozzle in the crosshair (MOSAIC_MOVE X= Y= Z=) and run MOSAIC_SET_TOOL. Then MOSAIC_LOAD_TOOL T=<n> for every other tool."
    {% endif %}

[gcode_macro _MOSAIC_START_PREPARE]
description: Save the gcode state and neutralise user offsets (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    SAVE_GCODE_STATE NAME=_MOSAIC
    G90
    {% if s.offset_method|string|lower == 'tool_parameter' %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

[gcode_macro _MOSAIC_START_RESET]
description: Zero the offsets of the non-reference tools, even when one of them is mounted (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set ref = s.reference_tool|int %}
    {% if printer.toolchanger.tool_number|int != ref and printer.toolchanger.tool_number|int != -1 %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={ref}
    {% endif %}
    MOSAIC_RESET_OFFSETS

[gcode_macro MOSAIC_LOAD_TOOL]
description: Pick up tool T and move it over the camera. T=<tool number>
gcode:
    {% set st = printer["gcode_macro _MOSAIC_STATE"] %}
    {% set t = params.T|default(-1)|int %}
    {% set ns = namespace(err="") %}
    {% if st.active|string|lower != 'true' %}
        {% set ns.err = "No MOSAIC session. Run MOSAIC_START first." %}
    {% elif t not in printer.toolchanger.tool_numbers %}
        {% set ns.err = "Tool T" ~ t ~ " does not exist." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was done."
    {% else %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={t}
        _MOSAIC_GOTO_CAMERA
        _MOSAIC_CAMERA_COOLING T={t}
    {% endif %}

[gcode_macro MOSAIC_MOVE]
description: Small relative move for centring the nozzle. X= Y= Z= in mm
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_STATE"] %}
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set z = params.Z|default(0)|float %}
    {% set ns = namespace(err="") %}
    {% if st.active|string|lower != 'true' %}
        {% set ns.err = "No MOSAIC session. Run MOSAIC_START first." %}
    {% elif x|abs > s.xy_move_limit|float or y|abs > s.xy_move_limit|float or z|abs > s.z_move_limit|float %}
        {% set ns.err = "Move too large. Limits per command: XY " ~ s.xy_move_limit ~ " mm, Z " ~ s.z_move_limit ~ " mm." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was done."
    {% else %}
        G91
        {% if z != 0 %}
            G1 Z{z} F300
        {% endif %}
        {% if x != 0 or y != 0 %}
            G1 X{x} Y{y} F{s.travel_speed|float * 60}
        {% endif %}
        G90
    {% endif %}

[gcode_macro MOSAIC_SET_TOOL]
description: The nozzle of the mounted tool is centred. Save it (reference tool: camera position, other tools: XY offsets).
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_STATE"] %}
    {% set svv = printer.save_variables.variables %}
    {% set method = s.offset_method|string|lower %}
    {% set ref = s.reference_tool|int %}
    {% set t = printer.toolchanger.tool_number|int %}
    {% set gp = printer.gcode_move.gcode_position %}
    {% set ns = namespace(err="", name="") %}
    {% if st.active|string|lower != 'true' %}
        {% set ns.err = "No MOSAIC session. Run MOSAIC_START first." %}
    {% elif t == -1 %}
        {% set ns.err = "No tool is mounted." %}
    {% elif t != ref and svv.mosaic_ref_x is not defined %}
        {% set ns.err = "No reference position yet. Mount the reference tool, centre it and run MOSAIC_SET_TOOL first." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was saved."
    {% elif t == ref %}
        SAVE_VARIABLE VARIABLE=mosaic_ref_x VALUE={gp.x|float|round(4)}
        SAVE_VARIABLE VARIABLE=mosaic_ref_y VALUE={gp.y|float|round(4)}
        SAVE_VARIABLE VARIABLE=mosaic_ref_z VALUE={gp.z|float|round(4)}
        _MOSAIC_ECHO MSG="Camera reference saved: X {'%.4f' % gp.x|float} Y {'%.4f' % gp.y|float} focus Z {'%.4f' % gp.z|float}. Offsets of the other tools relate to this position, align them again."
    {% else %}
        {% if method == 'tool_parameter' %}
            {% for i in range(printer.toolchanger.tool_numbers|length) %}
                {% if printer.toolchanger.tool_numbers[i]|int == t %}
                    {% set ns.name = printer.toolchanger.tool_names[i] %}
                {% endif %}
            {% endfor %}
            {% set old_x = printer[ns.name].gcode_x_offset|float %}
            {% set old_y = printer[ns.name].gcode_y_offset|float %}
            {% set old_z = printer[ns.name].gcode_z_offset|float %}
        {% else %}
            {% set old_x = printer.gcode_move.homing_origin.x|float %}
            {% set old_y = printer.gcode_move.homing_origin.y|float %}
            {% set old_z = printer.gcode_move.homing_origin.z|float %}
        {% endif %}
        {% set new_x = (old_x + gp.x|float - svv.mosaic_ref_x|float)|round(3) %}
        {% set new_y = (old_y + gp.y|float - svv.mosaic_ref_y|float)|round(3) %}
        _MOSAIC_STORE_OFFSET T={t} X={new_x} Y={new_y} Z={old_z}
        {% if method == 'tool_parameter' %}
            # the offset changed, so the gcode position of the same spot changed.
            # This move does not move the nozzle, it makes Klipper's position match.
            G90
            G1 X{svv.mosaic_ref_x|float} Y{svv.mosaic_ref_y|float} F600
        {% else %}
            SET_GCODE_OFFSET X={new_x} Y={new_y}
        {% endif %}
        _MOSAIC_ECHO MSG="T{t} offset saved: X {'%.3f' % new_x} Y {'%.3f' % new_y} (Z {'%.3f' % old_z}, measure it with MOSAIC_CALIBRATE_Z)"
    {% endif %}

[gcode_macro MOSAIC_END]
description: Finish the camera session. The reference tool is mounted and the LED is off.
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_STATE"] %}
    {% set ref = s.reference_tool|int %}
    {% if st.active|string|lower != 'true' %}
        _MOSAIC_ECHO TYPE=warning MSG="No MOSAIC session is running."
    {% else %}
        _MOSAIC_SAFE_Z
        _MOSAIC_SELECT T={ref}
        _MOSAIC_LED STATE=OFF
        _MOSAIC_CAMERA_COOLING T=-1
        {% if s.offset_method|string|lower == 'tool_parameter' %}
            RESTORE_GCODE_STATE NAME=_MOSAIC MOVE=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_STATE VARIABLE=active VALUE=False
        MOSAIC_ECHO_OFFSETS
    {% endif %}

# ---------------------------------------------------------------------------
# Z alignment with the switch
# ---------------------------------------------------------------------------
[gcode_macro MOSAIC_CALIBRATE_Z]
description: Measure the Z offset of every tool with the MOSAIC switch. TEMP=<nozzle C> overrides z_cal_temp. Can run on its own, for instance at print start.
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_STATE"] %}
    {% set ref = s.reference_tool|int %}
    {% set temp = params.TEMP|default(s.z_cal_temp)|float %}
    {% set own_session = st.active|string|lower != 'true' %}
    {% set start_tool = printer.toolchanger.tool_number|int if printer.toolchanger is defined else -1 %}
    {% set svv = printer.save_variables.variables if printer.save_variables is defined else {} %}
    {% set ns = namespace(err="") %}
    {% if printer.toolchanger is not defined %}
        {% set ns.err = "klipper-toolchanger is not configured." %}
    {% elif printer.mosaic_z_probe is not defined %}
        {% set ns.err = "The [mosaic_z_probe] section is missing. See README.md." %}
    {% elif printer.save_variables is not defined %}
        {% set ns.err = "A [save_variables] section is required." %}
    {% elif ref not in printer.toolchanger.tool_numbers %}
        {% set ns.err = "The reference tool T" ~ ref ~ " does not exist." %}
    {% elif printer.toolhead.homed_axes != "xyz" %}
        {% set ns.err = "Home all axes first." %}
    {% elif s.offset_method|string|lower not in ['tool_parameter', 'gcode_offset'] %}
        {% set ns.err = "offset_method in _MOSAIC_SETTINGS must be tool_parameter or gcode_offset." %}
    {% elif svv.mosaic_ref_x is not defined %}
        {% set ns.err = "No camera reference position yet. Run MOSAIC_START and MOSAIC_SET_TOOL on the reference tool first." %}
    {% elif s.safe_z|float <= s.z_search_min|float %}
        {% set ns.err = "safe_z must be higher than z_search_min in _MOSAIC_SETTINGS." %}
    {% endif %}
    {% if ns.err %}
        _MOSAIC_ECHO TYPE=warning MSG="{ns.err} Nothing was done."
    {% else %}
        {% if own_session %}
            _MOSAIC_START_PREPARE
        {% endif %}
        # reference tool first, then all others
        _MOSAIC_Z_TOOL T={ref} TEMP={temp} REFERENCE=1
        {% for n in printer.toolchanger.tool_numbers %}
            {% if n != ref %}
                _MOSAIC_Z_TOOL T={n} TEMP={temp} REFERENCE=0
            {% endif %}
        {% endfor %}
        # back to the tool that was mounted (or the reference tool)
        _MOSAIC_SAFE_Z
        {% if start_tool == -1 %}
            _MOSAIC_SELECT T={ref}
        {% else %}
            _MOSAIC_SELECT T={start_tool}
        {% endif %}
        # give every heater the target it had when this macro started
        {% if temp > 0 %}
            {% for i in range(printer.toolchanger.tool_numbers|length) %}
                {% set hn = printer[printer.toolchanger.tool_names[i]].heater %}
                {% if hn and printer[hn] is defined %}
                    SET_TOOL_TEMPERATURE T={printer.toolchanger.tool_numbers[i]} TARGET={printer[hn].target|float}
                {% endif %}
            {% endfor %}
        {% endif %}
        {% if own_session and s.offset_method|string|lower == 'tool_parameter' %}
            RESTORE_GCODE_STATE NAME=_MOSAIC MOVE=0
        {% endif %}
        MOSAIC_ECHO_OFFSETS
    {% endif %}

[gcode_macro _MOSAIC_Z_TOOL]
description: Mount tool T, heat it if wanted and measure it on the switch (internal). T= TEMP= REFERENCE=0|1
gcode:
    {% set t = params.T|int %}
    {% set temp = params.TEMP|default(0)|float %}
    {% set ns = namespace(heater="") %}
    {% for i in range(printer.toolchanger.tool_numbers|length) %}
        {% if printer.toolchanger.tool_numbers[i]|int == t %}
            {% set ns.heater = printer[printer.toolchanger.tool_names[i]].heater %}
        {% endif %}
    {% endfor %}
    _MOSAIC_SAFE_Z
    _MOSAIC_SELECT T={t}
    {% if temp > 0 and ns.heater %}
        SET_TOOL_TEMPERATURE T={t} TARGET={temp} WAIT=1
    {% endif %}
    _MOSAIC_Z_GOTO_SWITCH
    _MOSAIC_Z_COARSE
    _MOSAIC_Z_FINE
    _MOSAIC_Z_STORE T={t} REFERENCE={params.REFERENCE|default(0)|int}

[gcode_macro _MOSAIC_Z_GOTO_SWITCH]
description: Move the mounted nozzle above the Z switch (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set sx = svv.mosaic_ref_x|float + printer.mosaic_z_probe.x_offset|float %}
    {% set sy = svv.mosaic_ref_y|float + printer.mosaic_z_probe.y_offset|float %}
    _MOSAIC_SAFE_Z
    G90
    G1 X{sx} Y{sy} F{s.travel_speed|float * 60}
    G1 Z{s.safe_z|float} F{s.z_speed|float * 60}

[gcode_macro _MOSAIC_Z_COARSE]
description: Fast single search for the switch from safe_z downwards (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    # how far the toolhead can go down between here and z_search_min (machine Z)
    {% set travel = printer.toolhead.position.z|float - s.z_search_min|float %}
    MOSAIC_Z_PROBE SAMPLES=1 PROBE_SPEED={s.z_coarse_speed|float} MAX_TRAVEL={travel}

[gcode_macro _MOSAIC_Z_FINE]
description: Lift a little and measure the switch with the configured samples (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    G91
    G1 Z{s.z_coarse_lift|float} F{s.z_speed|float * 60}
    G90
    MOSAIC_Z_PROBE MAX_TRAVEL={s.z_coarse_lift|float * 2 + 1}

[gcode_macro _MOSAIC_Z_STORE]
description: Turn the measured trigger height into the Z offset of tool T (internal). T= REFERENCE=0|1
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_STATE"] %}
    {% set svv = printer.save_variables.variables %}
    {% set t = params.T|int %}
    {% set z = printer.mosaic_z_probe.last_z_result|float %}
    {% set rng = printer.mosaic_z_probe.last_range|float %}
    {% set ox = svv['t' ~ t ~ '_offset_x']|default(0)|float %}
    {% set oy = svv['t' ~ t ~ '_offset_y']|default(0)|float %}
    {% set oz = svv['t' ~ t ~ '_offset_z']|default(0)|float %}
    # lift off the switch first, with the offsets Klipper still has
    G91
    G1 Z{s.z_coarse_lift|float} F{s.z_speed|float * 60}
    G90
    {% if rng > s.z_range_warning|float %}
        _MOSAIC_ECHO TYPE=warning MSG="T{t}: the switch samples spread {'%.4f' % rng} mm, more than {'%.4f' % s.z_range_warning|float}. Clean the nozzle and the switch."
    {% endif %}
    {% if params.REFERENCE|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_STATE VARIABLE=z_ref VALUE={z}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_STATE VARIABLE=z_ref_offset VALUE={oz}
        _MOSAIC_ECHO MSG="T{t} (reference) triggers the switch at Z {'%.4f' % z}."
    {% else %}
        {% set new_z = (st.z_ref_offset|float + z - st.z_ref|float)|round(3) %}
        _MOSAIC_STORE_OFFSET T={t} X={ox} Y={oy} Z={new_z}
        _MOSAIC_ECHO MSG="T{t} triggers at Z {'%.4f' % z}, Z offset {'%.3f' % new_z} (was {'%.3f' % oz})."
    {% endif %}

[gcode_macro MOSAIC_CHECK]
description: Check that everything the MOSAIC macros need is in place
gcode:
    {% set s = printer["gcode_macro _MOSAIC_SETTINGS"] %}
    {% set svv = printer.save_variables.variables if printer.save_variables is defined else {} %}
    {% set ns = namespace(problems=0) %}
    {% if printer.toolchanger is not defined %}
        { action_respond_info("MOSAIC CHECK: FAIL  [toolchanger] section (klipper-toolchanger) is missing.") }
        {% set ns.problems = ns.problems + 1 %}
    {% else %}
        { action_respond_info("MOSAIC CHECK: ok    toolchanger with %d tools, reference tool T%d." % (printer.toolchanger.tool_numbers|length, s.reference_tool|int)) }
        {% if s.reference_tool|int not in printer.toolchanger.tool_numbers %}
            { action_respond_info("MOSAIC CHECK: FAIL  reference tool does not exist.") }
            {% set ns.problems = ns.problems + 1 %}
        {% endif %}
    {% endif %}
    {% if printer.toolchanger is defined %}
        {% for n in printer.toolchanger.tool_numbers %}
            {% set tool = printer[printer.toolchanger.tool_names[loop.index0]] %}
            {% if not tool.heater %}
                { action_respond_info("MOSAIC CHECK: note  T%d has no heater (no extruder: or heater: in its [tool] section)." % n) }
            {% elif printer[tool.heater] is not defined %}
                { action_respond_info("MOSAIC CHECK: FAIL  T%d heater '%s' does not exist." % (n, tool.heater)) }
                {% set ns.problems = ns.problems + 1 %}
            {% endif %}
            {% set cs = printer.configfile.settings %}
            {% set tcfg = cs[printer.toolchanger.tool_names[loop.index0]|lower] if cs[printer.toolchanger.tool_names[loop.index0]|lower] is defined else {} %}
            {% set tcc = cs['toolchanger'] if cs['toolchanger'] is defined else {} %}
            {% for opt in ['pickup_gcode', 'dropoff_gcode'] %}
                {% set body = (tcfg[opt] if tcfg[opt] is defined else (tcc[opt] if tcc[opt] is defined else ''))|string|trim %}
                {% if body == '' %}
                    { action_respond_info("MOSAIC CHECK: WARN  T%d has no %s. Tool changes will not move the toolhead to the dock, MOSAIC relies on it." % (n, opt)) }
                {% endif %}
            {% endfor %}
            {% if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined and printer.gcode.commands['T' ~ n] is defined %}
                {% if not (printer.gcode.commands['T' ~ n].help|string|lower).startswith('mosaic:') %}
                    { action_respond_info("MOSAIC CHECK: FAIL  T%d is not the MOSAIC tool macro. Include mosaic_tools.cfg before the [tool] sections." % n) }
                    {% set ns.problems = ns.problems + 1 %}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if printer.save_variables is not defined %}
        { action_respond_info("MOSAIC CHECK: FAIL  [save_variables] section is missing.") }
        {% set ns.problems = ns.problems + 1 %}
    {% endif %}
    {% if printer.mosaic_z_probe is not defined %}
        { action_respond_info("MOSAIC CHECK: FAIL  [mosaic_z_probe] section is missing, Z calibration is not possible.") }
        {% set ns.problems = ns.problems + 1 %}
    {% else %}
        { action_respond_info("MOSAIC CHECK: ok    Z switch at %.2f / %.2f from the camera." % (printer.mosaic_z_probe.x_offset|float, printer.mosaic_z_probe.y_offset|float)) }
    {% endif %}
    {% if printer["neopixel mosaic_led"] is defined %}
        { action_respond_info("MOSAIC CHECK: ok    LED ring found.") }
    {% else %}
        { action_respond_info("MOSAIC CHECK: note  no [neopixel mosaic_led], the LED is not controlled.") }
    {% endif %}
    {% if s.offset_method|string|lower not in ['tool_parameter', 'gcode_offset'] %}
        { action_respond_info("MOSAIC CHECK: FAIL  offset_method must be tool_parameter or gcode_offset.") }
        {% set ns.problems = ns.problems + 1 %}
    {% else %}
        { action_respond_info("MOSAIC CHECK: ok    offset_method %s." % s.offset_method) }
    {% endif %}
    {% if svv.mosaic_ref_x is defined %}
        { action_respond_info("MOSAIC CHECK: ok    camera reference saved.") }
    {% else %}
        { action_respond_info("MOSAIC CHECK: todo  no camera reference yet: MOSAIC_START, centre the reference tool, MOSAIC_SET_TOOL.") }
    {% endif %}
    {% if ns.problems == 0 %}
        { action_respond_info("MOSAIC CHECK: all required parts found.") }
    {% else %}
        { action_respond_info("MOSAIC CHECK: %d problem(s) found, see FAIL lines above." % ns.problems) }
    {% endif %}

[gcode_macro MOSAIC_AUTO_Z_OFFSET]
description: Print start helper. Measures the Z offsets of all tools. TEMP= overrides z_cal_temp. Call it after homing.
gcode:
    MOSAIC_CALIBRATE_Z {rawparams}
