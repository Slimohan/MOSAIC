# MOSAIC docking: pick-up / drop-off engine. YOU DO NOT EDIT THIS FILE.
# Your numbers live in section 7 of MOSAIC/mosaic.cfg.
#
# Made for a passive (Maxwell / kinematic) coupling: no lock to actuate, the
# carriage just has to be walked into the dock, seated and walked out again.
# Everything is plain motion in raw toolhead coordinates, so it needs the
# klipper-toolchanger "changing" state (a tool change, or ENTER_DOCKING_MODE)
# where the tool offsets are switched off.
#
# Hooked up in section 4 of MOSAIC/mosaic.cfg:
#   [toolchanger]
#   pickup_gcode:  MOSAIC_DOCK_PICKUP T={tool.tool_number} ...
#   dropoff_gcode: MOSAIC_DOCK_DROPOFF T={tool.tool_number}
#
# Klipper/Kalico macro rules that shape this file:
#  - a macro is rendered completely before its first command runs, so every
#    step that depends on the machine state lives in its own small macro
#  - comments are whole lines only
#  - a step list uses "/" between steps because ";" would start a G-code comment

[gcode_macro _MOSAIC_DOCK_STATE]
description: MOSAIC dock: internal state
variable_check_problems: 0
# acceleration that was set before the dock macros changed it, 0 = nothing saved
variable_print_accel: 0.0
variable_accel_saved: 0
# what _MOSAIC_DOCK_STATUS found out from the switches
#   sw_known: 1 when the carriage switch and a switch for every tool exist
#   sw_head: carriage switch, -1 no switch, 0 empty, 1 tool present
#   sw_empty: tool numbers whose dock is empty
#   sw_mounted: the tool on the carriage, -1 none, -2 cannot be told
variable_sw_known: 0
variable_sw_head: -1
variable_sw_empty: []
variable_sw_mounted: -2
variable_sw_text: ''
# A tool change that is run by a T command can fail "softly" during a print: a
# failed check sets failed, the macros finish the way back to the print position
# without docking anything further, and the T command then pauses the print.
#   in_t: a T command is running. change_to: the tool it is changing to.
#   failed: a check failed, failed_msg says which. moved: the carriage has moved.
variable_in_t: 0
variable_change_to: -1
variable_failed: 0
variable_failed_msg: ''
variable_moved: 0
# 1 makes the macros behave as if a print is running. For testing only.
variable_force_printing: 0
gcode:


# ---------------------------------------------------------------------------
# One move. DRY=1 only prints it.
#   _MOSAIC_DOCK_GO [X=] [Y=] [Z=] S=<mm/s> [A=fast|slow|<mm/s2>] [NOTE=<text>] [DRY=1]
# A= is the acceleration of this move. fast and slow are the accel_fast and
# accel_slow settings, a number is used as it is, nothing leaves it alone. It is
# never above the acceleration the print had when the dock macros started.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_GO]
description: MOSAIC dock: one move (internal)
gcode:
    {% set dry = params.DRY|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_DOCK_STATE"] %}
    {% set ns = namespace(axes="") %}
    {% for a in ["X", "Y", "Z"] %}
        {% if a in params %}
            {% set ns.axes = ns.axes ~ " " ~ a ~ ("%.3f" % (params[a]|float)) %}
        {% endif %}
    {% endfor %}
    {% set f = (params.S|default(10)|float) * 60 %}
    {% set av = params.A|default('')|string|trim|lower %}
    {% set want = 0.0 %}
    {% if av == 'fast' %}
        {% set want = s.accel_fast|default(0)|float(0) %}
    {% elif av == 'slow' %}
        {% set want = s.accel_slow|default(0)|float(0) %}
    {% elif av != '' %}
        {% set want = av|float(0) %}
    {% endif %}
    {% set cap = st.print_accel|float(0) if st.accel_saved|int == 1 else printer.toolhead.max_accel|float(0) %}
    {% set eff = [want, cap]|min if (want > 0 and cap > 0) else want %}
    {% if dry == 1 %}
        {% set msg = "DRY  G0" ~ ns.axes ~ (" F%.0f" % f) ~ ((" accel %.0f" % want) if want > 0 else "") ~ "   " ~ (params.NOTE|default("")) %}
        RESPOND TYPE=echo MSG="{msg}"
    {% else %}
        {% if eff > 0 and (eff - printer.toolhead.max_accel|float(0))|abs > 0.5 %}
            SET_VELOCITY_LIMIT ACCEL={eff}
        {% endif %}
        {% if ns.axes != "" %}
            G0{ns.axes} F{f}
        {% endif %}
    {% endif %}


# ---------------------------------------------------------------------------
# Acceleration of the dock moves. The print acceleration is remembered when the
# dock macros start and put back when they are done, also after a failed
# change. accel_fast and accel_slow in section 7, 0 = do not touch.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_ACCEL_SAVE]
description: MOSAIC dock: remember the print acceleration (internal)
gcode:
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_DOCK_STATE"] %}
    {% if (s.accel_fast|default(0)|float(0) > 0 or s.accel_slow|default(0)|float(0) > 0) and st.accel_saved|int == 0 %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=print_accel VALUE={printer.toolhead.max_accel|float}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=accel_saved VALUE=1
    {% endif %}

[gcode_macro _MOSAIC_ACCEL_RESTORE]
description: MOSAIC dock: put the print acceleration back (internal)
gcode:
    {% set st = printer["gcode_macro _MOSAIC_DOCK_STATE"] %}
    # While a failed change is being finished, the acceleration stays low: klipper-toolchanger
    # still makes its own move back to the print position. MOSAIC_TOOLCHANGE_ERROR puts it back (FORCE=1).
    {% if st.accel_saved|int == 1 and (st.failed|int == 0 or params.FORCE|default(0)|int == 1) %}
        {% if st.print_accel|float(0) > 0 %}
            SET_VELOCITY_LIMIT ACCEL={st.print_accel|float}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=accel_saved VALUE=0
    {% endif %}


# ---------------------------------------------------------------------------
# Checks everything about one dock before any motion happens.
#   _MOSAIC_DOCK_VALIDATE T=<n> [SOFT=1]
# SOFT=1 prints the result and goes on, otherwise a problem raises an error.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_VALIDATE]
description: MOSAIC dock: check the settings of one dock (internal)
gcode:
    {% set n = params.T|default(-1)|int %}
    {% set soft = params.SOFT|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% set d = printer["gcode_macro _MOSAIC_DOCK_T" ~ n] %}
    {% set ns = namespace(err="") %}
    {% if s is not defined %}
        {% set ns.err = ns.err ~ "section 7 (dock positions) of MOSAIC/mosaic.cfg is missing. " %}
    {% elif d is not defined %}
        {% set ns.err = ns.err ~ "there is no dock section for this tool number (sections exist for T0 to T9). " %}
    {% else %}
        {% set tmin = printer.toolhead.axis_minimum %}
        {% set tmax = printer.toolhead.axis_maximum %}
        {% if d.taught|int != 1 %}
            {% set ns.err = ns.err ~ "dock position not set up yet (variable_taught is 0). " %}
        {% endif %}
    {% endif %}
    {% if s is defined and d is defined and d.taught|int == 1 %}
        {% set tmin = printer.toolhead.axis_minimum %}
        {% set tmax = printer.toolhead.axis_maximum %}
        {% for k in ["travel_speed", "z_speed", "approach_speed", "engage_speed", "pullout_speed"] %}
            {% if s[k]|float(0) <= 0 %}
                {% set ns.err = ns.err ~ "setting " ~ k ~ " must be above 0. " %}
            {% endif %}
        {% endfor %}
        {% for k in ["accel_fast", "accel_slow"] %}
            {% if s[k]|default(0)|float(-1) < 0 %}
                {% set ns.err = ns.err ~ "setting " ~ k ~ " must not be negative. " %}
            {% endif %}
        {% endfor %}
        {% if s.safe_z|float(-1) < tmin.z or s.safe_z|float(-1) > tmax.z %}
            {% set ns.err = ns.err ~ "safe_z is outside the Z range of the printer. " %}
        {% endif %}
        {% set px = d.park_x|float %}
        {% set py = d.park_y|float %}
        {% set pz = d.park_z|float %}
        {% if px < tmin.x or px > tmax.x or py < tmin.y or py > tmax.y or pz < tmin.z or pz > tmax.z %}
            {% set ns.err = ns.err ~ "park position is outside the printer axis limits. " %}
        {% endif %}
        {% set ap = (d.approach|string|trim) or (s.approach|string|trim) %}
        {% set po = (d.pickup_out|string|trim) or (s.pickup_out|string|trim) %}
        {% set dro = (d.dropoff_out|string|trim) or (s.dropoff_out|string|trim) %}
        {% if ap == "" %}
            {% set ns.err = ns.err ~ "the approach path is empty. " %}
        {% endif %}
        {% set paths = [] %}
        {% if ap != "" %}{% set paths = paths + [["approach", ap]] %}{% endif %}
        {% if po != "" %}{% set paths = paths + [["pickup_out", po]] %}{% endif %}
        {% if dro != "" %}{% set paths = paths + [["dropoff_out", dro]] %}{% endif %}
        {% for pair in paths %}
            {% for wp in pair[1].split("/") %}
                {% set v = wp.split(",") %}
                {% if v|length < 3 or v[0]|float(none) is none or v[1]|float(none) is none or v[2]|float(none) is none %}
                    {% set ns.err = ns.err ~ pair[0] ~ " step " ~ loop.index ~ " is not dx,dy,dz. " %}
                {% else %}
                    {% set x = px + v[0]|float %}
                    {% set y = py + v[1]|float %}
                    {% set z = pz + v[2]|float %}
                    {% if x < tmin.x or x > tmax.x or y < tmin.y or y > tmax.y or z < tmin.z or z > tmax.z %}
                        {% set ns.err = ns.err ~ pair[0] ~ " step " ~ loop.index ~ " would leave the printer axis limits. " %}
                    {% endif %}
                    {% if v|length > 3 and v[3]|trim != "" and v[3]|float(0) <= 0 %}
                        {% set ns.err = ns.err ~ pair[0] ~ " step " ~ loop.index ~ " has a speed that is not above 0. " %}
                    {% endif %}
                    {% if v|length > 5 and v[5]|trim != "" and v[5]|trim|lower not in ["fast", "slow"] and v[5]|float(0) <= 0 %}
                        {% set ns.err = ns.err ~ pair[0] ~ " step " ~ loop.index ~ " has an acceleration that is not fast, slow or a number above 0. " %}
                    {% endif %}
                {% endif %}
            {% endfor %}
        {% endfor %}
    {% endif %}
    {% if ns.err != "" %}
        {% if soft == 1 %}
            RESPOND TYPE=error MSG="{'MOSAIC dock T%d: PROBLEM  %s' % (n, ns.err)}"
            SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=check_problems VALUE={printer["gcode_macro _MOSAIC_DOCK_STATE"].check_problems|int + 1}
        {% else %}
            { action_raise_error("MOSAIC dock T%d: %s" % (n, ns.err)) }
        {% endif %}
    {% elif soft == 1 %}
        RESPOND TYPE=echo MSG="{'MOSAIC dock T%d: ok  (park X%.2f Y%.2f Z%.2f)' % (n, d.park_x|float, d.park_y|float, d.park_z|float)}"
    {% endif %}


# ---------------------------------------------------------------------------
# Start and end of every run: make sure the carriage is at safe height.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_BEGIN]
description: MOSAIC dock: go to safe height first (internal)
gcode:
    {% set dry = params.DRY|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% if dry == 0 %}
        G90
        _MOSAIC_ACCEL_SAVE
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=moved VALUE=1
    {% endif %}
    {% if printer.toolhead.position.z < s.safe_z|float %}
        _MOSAIC_DOCK_GO Z={s.safe_z|float} S={s.z_speed|float} A=fast NOTE=up_to_safe_z DRY={dry}
    {% endif %}

[gcode_macro _MOSAIC_DOCK_END]
description: MOSAIC dock: back to safe height (internal)
gcode:
    {% set dry = params.DRY|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% if dry == 1 or printer.toolhead.position.z < s.safe_z|float %}
        _MOSAIC_DOCK_GO Z={s.safe_z|float} S={s.z_speed|float} A={'slow' if printer["gcode_macro _MOSAIC_DOCK_STATE"].failed|int == 1 else 'fast'} NOTE=up_to_safe_z DRY={dry}
    {% endif %}


# ---------------------------------------------------------------------------
# Walk one of the three paths of a dock.
#   _MOSAIC_DOCK_WALK T=<n> MODE=approach|pickup_out|dropoff_out [TO=stage|park] [DRY=1]
# TO=stage (approach only) stops at the last approach step before the dock.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_WALK]
description: MOSAIC dock: walk a path (internal)
gcode:
    {% set n = params.T|int %}
    {% set mode = params.MODE|string %}
    {% set to = params.TO|default("park")|string %}
    {% set dry = params.DRY|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% set d = printer["gcode_macro _MOSAIC_DOCK_T" ~ n] %}
    {% set ts = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined else {} %}
    {% set hname = ts.head_switch|default('mosaic_head')|string|trim %}
    {% set px = d.park_x|float %}
    {% set py = d.park_y|float %}
    {% set pz = d.park_z|float %}
    {% set ap = (d.approach|string|trim) or (s.approach|string|trim) %}
    {% if mode == "approach" %}
        {% set items = ap.split("/") %}
        {% set explicit = true %}
    {% else %}
        {% set own = (d[mode]|string|trim) or (s[mode]|string|trim) %}
        {% if own != "" %}
            {% set items = own.split("/") %}
            {% set explicit = true %}
        {% else %}
            {% set items = ap.split("/")|reverse|list %}
            {% set explicit = false %}
        {% endif %}
    {% endif %}
    {% for wp in items %}
        {% set v = wp.split(",") %}
        {% set x = px + v[0]|float %}
        {% set y = py + v[1]|float %}
        {% set z = pz + v[2]|float %}
        {% set sp = 0.0 %}
        {% if explicit and v|length > 3 and v[3]|trim != "" %}
            {% set sp = v[3]|float %}
        {% endif %}
        {% set verify = explicit and v|length > 4 and v[4]|trim != "" %}
        {% set acc = (v[5]|trim|lower if explicit and v|length > 5 and v[5]|trim != "" else "") %}
        {% if mode == "approach" %}
            {% if loop.first %}
                _MOSAIC_DOCK_GO X={x} Y={y} S={s.travel_speed|float} A={acc or 'fast'} NOTE=to_first_approach_step DRY={dry}
                _MOSAIC_DOCK_GO Z={z} S={s.z_speed|float} A={acc or 'fast'} NOTE=down_to_first_approach_step DRY={dry}
            {% else %}
                _MOSAIC_DOCK_GO X={x} Y={y} Z={z} S={sp if sp > 0 else s.approach_speed|float} A={acc or 'fast'} NOTE=approach_step_{loop.index} DRY={dry}
            {% endif %}
        {% else %}
            _MOSAIC_DOCK_GO X={x} Y={y} Z={z} S={sp if sp > 0 else s.pullout_speed|float} A={acc or 'slow'} NOTE={mode}_step_{loop.index} DRY={dry}
            {% if verify and mode == "pickup_out" %}
                {% if dry == 1 %}
                    RESPOND TYPE=echo MSG="DRY  check that the carriage switch shows the tool"
                {% elif printer["gcode_button " ~ hname] is defined %}
                    M400
                    G4 P{s.switch_settle|int}
                    _MOSAIC_DOCK_SWITCHES T={n} WHEN=during_pickup
                {% else %}
                    VERIFY_TOOL_DETECTED T={n}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if mode == "approach" and to != "stage" %}
        _MOSAIC_DOCK_GO X={px} Y={py} Z={pz} S={s.engage_speed|float} A=slow NOTE=into_dock DRY={dry}
    {% endif %}


# ---------------------------------------------------------------------------
# Back to the place the print was at, sideways first at safe height, then
# down. RX, RY, RZ come from the toolchanger's restore_position. Handed over
# after a pickup, and after a dropoff when no new tool follows (UNSELECT_TOOL).
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_RESTORE]
description: MOSAIC dock: return to the print position (internal)
gcode:
    {% set dry = params.DRY|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    # After a failed check the carriage stays where it is: a tool that may be half coupled is not
    # carried over the print. (klipper-toolchanger itself still moves back to the print position at
    # the end of the change, see docs/docking.md.)
    {% if dry == 1 or printer["gcode_macro _MOSAIC_DOCK_STATE"].failed|int == 0 %}
        {% if "RX" in params or "RY" in params %}
            {% set ns = namespace(axes="") %}
            {% if "RX" in params %}{% set ns.axes = ns.axes ~ " X=" ~ params.RX %}{% endif %}
            {% if "RY" in params %}{% set ns.axes = ns.axes ~ " Y=" ~ params.RY %}{% endif %}
            _MOSAIC_DOCK_GO{ns.axes} S={s.travel_speed|float} A=fast NOTE=back_to_print_xy DRY={dry}
        {% endif %}
        {% if "RZ" in params %}
            _MOSAIC_DOCK_GO Z={params.RZ} S={s.z_speed|float} A=fast NOTE=back_to_print_z DRY={dry}
        {% endif %}
    {% endif %}


# ---------------------------------------------------------------------------
# The whole pick-up or drop-off.
#   _MOSAIC_DOCK_RUN T=<n> ACTION=pickup|dropoff [RX= RY= RZ=] [DRY=1]
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_RUN]
description: MOSAIC dock: pick up or drop off one tool (internal)
gcode:
    {% set n = params.T|int %}
    {% set action = params.ACTION|string %}
    {% set dry = params.DRY|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% if dry == 0 %}
        {% if printer.toolchanger is not defined %}
            { action_raise_error("MOSAIC dock: there is no [toolchanger] section.") }
        {% elif printer.toolchanger.status != "changing" %}
            { action_raise_error("MOSAIC dock: refusing to move, the toolchanger is %s. The dock macros only move during a tool change or after ENTER_DOCKING_MODE, because the tool offsets must be off. Use DRY=1 to only print the plan." % printer.toolchanger.status) }
        {% endif %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            { action_raise_error("MOSAIC dock: home the printer first.") }
        {% endif %}
    {% endif %}
    _MOSAIC_DOCK_VALIDATE T={n}
    RESPOND TYPE=echo MSG="{'MOSAIC dock: %s T%d%s' % (action, n, ' (dry run, nothing moves)' if dry == 1 else '')}"
    # after a soft failure earlier in this change the checks are not repeated
    {% if printer["gcode_macro _MOSAIC_DOCK_STATE"].failed|int == 0 or dry == 1 %}
        {% if s.check_switches|int == 1 and s.check_count|default(1)|int == 1 %}
            _MOSAIC_DOCK_COUNT T={n} SOFT={dry}
        {% endif %}
        {% if s.check_switches|int == 1 %}
            _MOSAIC_DOCK_SWITCHES T={n} WHEN=before_{action} SOFT={dry}
        {% endif %}
    {% endif %}
    _MOSAIC_DOCK_RUN_MOVE {rawparams}


# The moving part of a pick-up / drop-off. It is its own macro because it looks
# at "failed" when it starts, after the checks of _MOSAIC_DOCK_RUN have run.
# After a soft failure (see _MOSAIC_DOCK_FAIL) nothing is docked any more: if
# the carriage has moved it only goes up to safe height and back to the print
# position, the same two moves that end every normal change.
[gcode_macro _MOSAIC_DOCK_RUN_MOVE]
description: MOSAIC dock: the moves of one pick-up or drop-off (internal)
gcode:
    {% set n = params.T|int %}
    {% set action = params.ACTION|string %}
    {% set dry = params.DRY|default(0)|int %}
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% set st = printer["gcode_macro _MOSAIC_DOCK_STATE"] %}
    {% set ns = namespace(extra="") %}
    {% for k in ["RX", "RY", "RZ"] %}
        {% if k in params %}{% set ns.extra = ns.extra ~ " " ~ k ~ "=" ~ params[k] %}{% endif %}
    {% endfor %}
    {% if dry == 0 and st.failed|int == 1 %}
        {% if st.moved|int == 1 %}
            _MOSAIC_ACCEL_SAVE
            _MOSAIC_DOCK_END DRY=0
        {% endif %}
        _MOSAIC_ACCEL_RESTORE
    {% else %}
        _MOSAIC_DOCK_BEGIN DRY={dry}
        _MOSAIC_DOCK_WALK T={n} MODE=approach DRY={dry}
        {% if dry == 1 %}
            RESPOND TYPE=echo MSG="DRY  wait {s.seat_dwell|int} ms while the coupling seats"
        {% else %}
            G4 P{s.seat_dwell|int}
        {% endif %}
        _MOSAIC_DOCK_WALK T={n} MODE={action}_out DRY={dry}
        {% if s.check_switches|int == 1 %}
            {% if dry == 1 %}
                RESPOND TYPE=echo MSG="DRY  check the switches once the carriage is out of the dock"
            {% else %}
                M400
                G4 P{s.switch_settle|int}
                _MOSAIC_DOCK_SWITCHES T={n} WHEN=after_{action}
            {% endif %}
        {% endif %}
        _MOSAIC_DOCK_END DRY={dry}
        {% if s.restore_move|int == 1 and ns.extra != "" %}
            _MOSAIC_DOCK_RESTORE{ns.extra} DRY={dry}
        {% endif %}
        _MOSAIC_ACCEL_RESTORE
    {% endif %}


# ---------------------------------------------------------------------------
# Compare the two switches with what should be true at this point.
#   _MOSAIC_DOCK_SWITCHES T=<n> WHEN=before_pickup|before_dropoff|after_pickup|
#                         after_dropoff|during_pickup [SOFT=1] [DOCK=0|1] [HEAD=0|1]
# Dock switch  pressed = tool is in its dock      (name: dock_switches)
# Head switch  pressed = a tool is on the carriage (name: head_switch)
# The names come from _MOSAIC_TOOLS_SETTINGS, see core/mosaic_tools.cfg.
# A switch that is not configured is skipped. SOFT=1 prints instead of raising.
# DOCK= and HEAD= replace the readings (for testing).
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_SWITCHES]
description: MOSAIC dock: compare the dock and carriage switches with the expected state (internal)
gcode:
    {% set n = params.T|int %}
    {% set when = params.WHEN|string %}
    {% set soft = params.SOFT|default(0)|int %}
    {% set ts = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined else {} %}
    {% set dl = (ts.dock_switches|default('')|string).split(',') %}
    {% set dname = dl[n]|trim if n < dl|length and dl[n]|trim != '' else 'mosaic_dock_t' ~ n %}
    {% set dsw = printer["gcode_button " ~ dname] %}
    {% set hsw = printer["gcode_button " ~ (ts.head_switch|default('mosaic_head')|string|trim)] %}
    {% set dock = -1 %}
    {% set head = -1 %}
    {% if dsw is defined %}{% set dock = 1 if dsw.state == "PRESSED" else 0 %}{% endif %}
    {% if hsw is defined %}{% set head = 1 if hsw.state == "PRESSED" else 0 %}{% endif %}
    {% if "DOCK" in params %}{% set dock = params.DOCK|int %}{% endif %}
    {% if "HEAD" in params %}{% set head = params.HEAD|int %}{% endif %}
    {% set want = {"before_pickup": [1, 0], "before_dropoff": [0, 1], "after_pickup": [0, 1], "after_dropoff": [1, 0], "during_pickup": [-1, 1]}[when] %}
    {% set err = "" %}
    {% if when == "before_pickup" %}
        {% if dock == 0 %}{% set err = err ~ "the dock switch says T" ~ n ~ " is not in its dock. " %}{% endif %}
        {% if head == 1 %}{% set err = err ~ "the carriage switch says a tool is already on the carriage. " %}{% endif %}
    {% elif when == "before_dropoff" %}
        {% if head == 0 %}{% set err = err ~ "the carriage switch says there is no tool on the carriage, nothing to put back. " %}{% endif %}
        {% if dock == 1 %}{% set err = err ~ "the dock switch says the dock of T" ~ n ~ " is already occupied. " %}{% endif %}
    {% elif when == "during_pickup" %}
        {% if head == 0 %}{% set err = err ~ "the carriage switch does not show the tool on the carriage. " %}{% endif %}
    {% elif when == "after_pickup" %}
        {% if dock == 1 and head == 0 %}
            {% set err = err ~ "T" ~ n ~ " stayed in its dock, the coupling did not take it. " %}
        {% elif dock == 0 and head == 0 %}
            {% set err = err ~ "T" ~ n ~ " is neither in the dock nor on the carriage, it may have dropped on the way out. Look under the toolhead. " %}
        {% elif dock == 1 and head == 1 %}
            {% set err = err ~ "both switches show the tool. Check the switch wiring and polarity. " %}
        {% elif dock == 1 %}
            {% set err = err ~ "the dock switch still shows T" ~ n ~ " in its dock. " %}
        {% elif head == 0 %}
            {% set err = err ~ "the carriage switch does not show the tool on the carriage. " %}
        {% endif %}
    {% elif when == "after_dropoff" %}
        {% if dock == 0 and head == 1 %}
            {% set err = err ~ "T" ~ n ~ " is still on the carriage and not seated in its dock. " %}
        {% elif dock == 0 and head == 0 %}
            {% set err = err ~ "T" ~ n ~ " is neither in the dock nor on the carriage, it may have dropped. Look under the toolhead. " %}
        {% elif dock == 1 and head == 1 %}
            {% set err = err ~ "both switches show the tool. Check the switch wiring and polarity. " %}
        {% elif dock == 0 %}
            {% set err = err ~ "the dock switch does not show T" ~ n ~ " in its dock. " %}
        {% elif head == 1 %}
            {% set err = err ~ "the carriage switch still shows a tool on the carriage. " %}
        {% endif %}
    {% endif %}
    {% set names = {-1: "no switch", 0: "empty", 1: "tool present"} %}
    {% if soft == 1 %}
        {% set msg = "MOSAIC dock T%d switches (%s): dock %s, carriage %s -> %s" % (n, when, names[dock], names[head], "PROBLEM: " ~ err if err != "" else "as expected") %}
        RESPOND TYPE={"error" if err != "" else "echo"} MSG="{msg}"
    {% elif err != "" %}
        _MOSAIC_DOCK_FAIL MSG="{'MOSAIC dock T%d (%s): %s' % (n, when, err|replace('"', "'"))}"
    {% endif %}


# ---------------------------------------------------------------------------
# What do the switches say about the whole changer?
#   _MOSAIC_DOCK_STATUS
# Needs the carriage switch and a dock switch for every tool, otherwise
# sw_known stays 0. The result is in the variables of _MOSAIC_DOCK_STATE.
# Every tool is either in its dock or on the carriage, so the number of tools
# that the switches see must be the number of tools. A tool on the carriage
# means exactly one empty dock, an empty carriage means no empty dock.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_STATUS]
description: MOSAIC dock: read all switches and work out which tool is on the carriage (internal)
gcode:
    {% set ts = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined else {} %}
    {% set dl = (ts.dock_switches|default('')|string).split(',') %}
    {% set hsw = printer["gcode_button " ~ (ts.head_switch|default('mosaic_head')|string|trim)] %}
    {% set ns = namespace(known=(hsw is defined and printer.toolchanger is defined), empty=[], text="") %}
    {% set head = (1 if hsw.state == "PRESSED" else 0) if hsw is defined else -1 %}
    {% if printer.toolchanger is defined %}
        {% for n in printer.toolchanger.tool_numbers %}
            {% set dname = dl[n]|trim if n < dl|length and dl[n]|trim != '' else 'mosaic_dock_t' ~ n %}
            {% set dsw = printer["gcode_button " ~ dname] %}
            {% if dsw is not defined %}
                {% set ns.known = false %}
            {% elif dsw.state != "PRESSED" %}
                {% set ns.empty = ns.empty + [n] %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% set mounted = -2 %}
    {% if ns.known %}
        {% set lst = (ns.empty|map('string')|join(', T')) %}
        {% if head == 1 and ns.empty|length == 1 %}
            {% set mounted = ns.empty[0] %}
            {% set ns.text = "T%d is on the carriage" % ns.empty[0] %}
        {% elif head == 0 and ns.empty|length == 0 %}
            {% set mounted = -1 %}
            {% set ns.text = "no tool on the carriage, every tool is in its dock" %}
        {% elif head == 1 and ns.empty|length == 0 %}
            {% set ns.text = "the carriage switch shows a tool, but every dock is occupied" %}
        {% elif head == 1 %}
            {% set ns.text = "the carriage switch shows a tool, but %d docks are empty (T%s)" % (ns.empty|length, lst) %}
        {% else %}
            {% set ns.text = "the carriage switch shows no tool, but the dock of T%s is empty" % lst %}
        {% endif %}
    {% else %}
        {% set ns.text = "the carriage switch or a dock switch is not configured" %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=sw_known VALUE={1 if ns.known else 0}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=sw_head VALUE={head}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=sw_empty VALUE="{ns.empty}"
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=sw_mounted VALUE={mounted}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=sw_text VALUE="'{ns.text}'"


# Tool count check before a change: no motion yet. A tool that was knocked
# off, or taken out by hand, between two changes is found here.
#   _MOSAIC_DOCK_COUNT T=<n> [SOFT=1]
[gcode_macro _MOSAIC_DOCK_COUNT]
description: MOSAIC dock: are all tools where the switches say they should be (internal)
gcode:
    _MOSAIC_DOCK_STATUS
    _MOSAIC_DOCK_COUNT_RESULT {rawparams}

[gcode_macro _MOSAIC_DOCK_COUNT_RESULT]
description: MOSAIC dock: result of the tool count check (internal)
gcode:
    {% set n = params.T|default(-1)|int %}
    {% set soft = params.SOFT|default(0)|int %}
    {% set st = printer["gcode_macro _MOSAIC_DOCK_STATE"] %}
    {% if st.sw_known|int == 1 %}
        {% if st.sw_mounted|int == -2 %}
            {% set total = printer.toolchanger.tool_numbers|length - st.sw_empty|length + (1 if st.sw_head|int == 1 else 0) %}
            {% set msg = "MOSAIC dock T%d (tool count): the switches see %d tools, there should be %d. %s. A tool may have been knocked off or taken out." % (n, total, printer.toolchanger.tool_numbers|length, (st.sw_text|string)[:1]|upper ~ (st.sw_text|string)[1:]) %}
            {% if soft == 1 %}
                RESPOND TYPE=error MSG="{msg}"
            {% else %}
                _MOSAIC_DOCK_FAIL MSG="{msg}"
            {% endif %}
        {% elif soft == 1 %}
            RESPOND TYPE=echo MSG="{'MOSAIC dock T%d (tool count): ok, %s' % (n, st.sw_text)}"
        {% endif %}
    {% elif soft == 1 %}
        RESPOND TYPE=echo MSG="MOSAIC dock (tool count): skipped, the carriage switch or a dock switch is not configured."
    {% endif %}


# ---------------------------------------------------------------------------
# A check failed.
#   _MOSAIC_DOCK_FAIL MSG=<text>
# Outside a print, or with pause_on_error off, it is an ordinary error that stops
# whatever is running. During a print, in a change that a T command runs, it is a
# soft failure: it is noted (failed, failed_msg) and the macros finish the change
# without docking anything more. A check before the carriage moved leaves it where
# it is. The T command then pauses the print (_MOSAIC_T_DONE, MOSAIC_TOOLCHANGE_ERROR)
# and MOSAIC_RESUME repairs the changer after you fixed the tool by hand.
# A real error would end the print: Klipper cannot pause a print from inside a
# failing G-code command, and klipper-toolchanger forgets its state with it.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_DOCK_FAIL]
description: MOSAIC dock: a check failed, pause the print or raise an error (internal)
gcode:
    {% set msg = params.MSG|default("MOSAIC dock: check failed")|string|replace('"', '')|replace("'", '') %}
    {% set ts = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined else {} %}
    {% set st = printer["gcode_macro _MOSAIC_DOCK_STATE"] %}
    {% set printing = (printer.print_stats is defined and printer.print_stats.state|default('') == 'printing') or st.force_printing|int == 1 %}
    {% if ts.pause_on_error|default(True) and printing and st.in_t|int == 1 and printer.toolchanger.status == 'changing' %}
        {% if st.failed|int == 0 %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=failed VALUE=1
            SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=failed_msg VALUE="'{msg}'"
            RESPOND TYPE=error MSG="{msg}"
        {% endif %}
    {% else %}
        _MOSAIC_ACCEL_RESTORE FORCE=1
        _MOSAIC_DOCK_RAISE MSG="{msg}"
    {% endif %}

# The error comes from its own macro: a macro is rendered before it runs, so an
# error raised in _MOSAIC_DOCK_FAIL itself would come before the acceleration is put back.
[gcode_macro _MOSAIC_DOCK_RAISE]
description: MOSAIC dock: raise an error (internal). MSG=
gcode:
    { action_raise_error(params.MSG|default("MOSAIC dock: check failed")) }


# ---------------------------------------------------------------------------
# For the release_gcode of the carriage switch (head_switch): the switch let
# go while a tool is selected and no tool change is running = the tool is gone.
# ---------------------------------------------------------------------------
[gcode_macro MOSAIC_DOCK_HEAD_RELEASED]
description: MOSAIC dock: call from release_gcode of the carriage switch, pauses the print if a selected tool fell off
gcode:
    {% if printer.toolchanger is defined and printer.toolchanger.status == "ready" and printer.toolchanger.tool_number >= 0 %}
        RESPOND TYPE=error MSG="{'MOSAIC: the carriage switch let go while T%d is selected. The tool may have fallen off.' % printer.toolchanger.tool_number}"
        {% if printer.print_stats is defined and printer.print_stats.state == "printing" %}
            PAUSE
            _MOSAIC_NOTIFY MSG="{'MOSAIC: the carriage switch let go while T%d is selected, the print is paused.' % printer.toolchanger.tool_number}"
        {% endif %}
    {% endif %}


# ===========================================================================
# Commands you use
# ===========================================================================

[gcode_macro MOSAIC_DOCK_PICKUP]
description: MOSAIC dock: take tool T from its dock. Put it in pickup_gcode. DRY=1 prints the plan.
gcode:
    {% if params.T is not defined %}
        { action_raise_error("MOSAIC_DOCK_PICKUP needs T=<tool number>") }
    {% endif %}
    {% set ns = namespace(extra="") %}
    {% for k in ["RX", "RY", "RZ"] %}
        {% if k in params %}{% set ns.extra = ns.extra ~ " " ~ k ~ "=" ~ params[k] %}{% endif %}
    {% endfor %}
    _MOSAIC_DOCK_RUN T={params.T|int} ACTION=pickup DRY={params.DRY|default(0)|int}{ns.extra}

[gcode_macro MOSAIC_DOCK_DROPOFF]
description: MOSAIC dock: put tool T back in its dock. Put it in dropoff_gcode. DRY=1 prints the plan.
gcode:
    {% if params.T is not defined %}
        { action_raise_error("MOSAIC_DOCK_DROPOFF needs T=<tool number>") }
    {% endif %}
    {% set ns = namespace(extra="") %}
    {% for k in ["RX", "RY", "RZ"] %}
        {% if k in params %}{% set ns.extra = ns.extra ~ " " ~ k ~ "=" ~ params[k] %}{% endif %}
    {% endfor %}
    _MOSAIC_DOCK_RUN T={params.T|int} ACTION=dropoff DRY={params.DRY|default(0)|int}{ns.extra}


[gcode_macro MOSAIC_DOCK_GOTO]
description: MOSAIC dock: MOSAIC_DOCK_GOTO T=<n> WHERE=stage|park, drive to a dock to check it (docking mode needed)
gcode:
    {% set n = params.T|default(-1)|int %}
    {% set where = params.WHERE|default("stage")|string|lower %}
    {% set dry = params.DRY|default(0)|int %}
    {% if where not in ["stage", "park"] %}
        { action_raise_error("MOSAIC_DOCK_GOTO: WHERE must be stage or park") }
    {% endif %}
    {% if dry == 0 %}
        {% if printer.toolchanger is not defined or printer.toolchanger.status != "changing" %}
            { action_raise_error("MOSAIC_DOCK_GOTO: run ENTER_DOCKING_MODE first (it switches the tool offsets off), EXIT_DOCKING_MODE when done.") }
        {% endif %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            { action_raise_error("MOSAIC_DOCK_GOTO: home the printer first.") }
        {% endif %}
    {% endif %}
    _MOSAIC_DOCK_VALIDATE T={n}
    SAVE_GCODE_STATE NAME=_mosaic_dock
    _MOSAIC_DOCK_BEGIN DRY={dry}
    _MOSAIC_DOCK_WALK T={n} MODE=approach TO={where} DRY={dry}
    RESTORE_GCODE_STATE NAME=_mosaic_dock MOVE=0
    {% if dry == 0 %}
        _MOSAIC_ACCEL_RESTORE FORCE=1
        RESPOND TYPE=echo MSG="{'MOSAIC dock: carriage is at the %s of T%d. Leave with MOSAIC_DOCK_LEAVE T=%d MODE=pickup or MODE=dropoff.' % (where, n, n)}"
    {% endif %}

[gcode_macro MOSAIC_DOCK_LEAVE]
description: MOSAIC dock: MOSAIC_DOCK_LEAVE T=<n> MODE=pickup|dropoff, walk out of the dock the way a pickup/dropoff would
gcode:
    {% set n = params.T|default(-1)|int %}
    {% set mode = params.MODE|default("")|string|lower %}
    {% set dry = params.DRY|default(0)|int %}
    {% if mode not in ["pickup", "dropoff"] %}
        { action_raise_error("MOSAIC_DOCK_LEAVE: MODE must be pickup or dropoff") }
    {% endif %}
    {% if dry == 0 %}
        {% if printer.toolchanger is not defined or printer.toolchanger.status != "changing" %}
            { action_raise_error("MOSAIC_DOCK_LEAVE: run ENTER_DOCKING_MODE first, EXIT_DOCKING_MODE when done.") }
        {% endif %}
    {% endif %}
    _MOSAIC_DOCK_VALIDATE T={n}
    SAVE_GCODE_STATE NAME=_mosaic_dock
    G90
    {% if dry == 0 %}
        _MOSAIC_ACCEL_SAVE
    {% endif %}
    _MOSAIC_DOCK_WALK T={n} MODE={mode}_out DRY={dry}
    _MOSAIC_DOCK_END DRY={dry}
    RESTORE_GCODE_STATE NAME=_mosaic_dock MOVE=0
    _MOSAIC_ACCEL_RESTORE FORCE=1


[gcode_macro MOSAIC_DOCK_TEACH]
description: MOSAIC dock: MOSAIC_DOCK_TEACH T=<n>, take the carriage's current position as the dock position of tool n
gcode:
    {% set n = params.T|default(-1)|int %}
    {% if printer["gcode_macro _MOSAIC_DOCK_T" ~ n] is not defined %}
        { action_raise_error("MOSAIC_DOCK_TEACH: give T=<tool number 0-9>") }
    {% endif %}
    {% set p = printer.toolhead.position %}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{n} VARIABLE=park_x VALUE={"%.3f" % p.x}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{n} VARIABLE=park_y VALUE={"%.3f" % p.y}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{n} VARIABLE=park_z VALUE={"%.3f" % p.z}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{n} VARIABLE=taught VALUE=1
    RESPOND TYPE=echo MSG="{'MOSAIC dock T%d is set for now. To keep it, paste these lines into [gcode_macro _MOSAIC_DOCK_T%d] in section 7 of MOSAIC/mosaic.cfg:' % (n, n)}"
    RESPOND TYPE=echo MSG="{'variable_taught: 1'}"
    RESPOND TYPE=echo MSG="{'variable_park_x: %.3f' % p.x}"
    RESPOND TYPE=echo MSG="{'variable_park_y: %.3f' % p.y}"
    RESPOND TYPE=echo MSG="{'variable_park_z: %.3f' % p.z}"

[gcode_macro MOSAIC_DOCK_FILL]
description: MOSAIC dock: MOSAIC_DOCK_FILL FROM=0 TO=5 DX=45 [DY=0 DZ=0], docks in an even row: copy the position of one tool to the others
gcode:
    {% set a = params.FROM|default(-1)|int %}
    {% set b = params.TO|default(-1)|int %}
    {% set dx = params.DX|default(0)|float %}
    {% set dy = params.DY|default(0)|float %}
    {% set dz = params.DZ|default(0)|float %}
    {% set src = printer["gcode_macro _MOSAIC_DOCK_T" ~ a] %}
    {% if src is not defined or b <= a or b > 9 %}
        { action_raise_error("MOSAIC_DOCK_FILL: give FROM=<0-9> TO=<higher number, at most 9> and the spacing DX/DY/DZ") }
    {% endif %}
    {% if src.taught|int != 1 %}
        { action_raise_error("MOSAIC_DOCK_FILL: set up the FROM dock first (MOSAIC_DOCK_TEACH T=%d)" % a) }
    {% endif %}
    {% for i in range(a + 1, b + 1) %}
        {% set k = i - a %}
        {% set x = src.park_x|float + k * dx %}
        {% set y = src.park_y|float + k * dy %}
        {% set z = src.park_z|float + k * dz %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{i} VARIABLE=park_x VALUE={"%.3f" % x}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{i} VARIABLE=park_y VALUE={"%.3f" % y}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{i} VARIABLE=park_z VALUE={"%.3f" % z}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{i} VARIABLE=taught VALUE=1
        RESPOND TYPE=echo MSG="{'T%d: variable_taught: 1   variable_park_x: %.3f   variable_park_y: %.3f   variable_park_z: %.3f' % (i, x, y, z)}"
    {% endfor %}
    RESPOND TYPE=echo MSG="These docks are calculated, not measured. Check each one with MOSAIC_DOCK_GOTO T=<n> WHERE=stage before the first real tool change, then paste the lines into section 7 of MOSAIC/mosaic.cfg."

[gcode_macro MOSAIC_DOCK_SET]
description: MOSAIC dock: change a dock until the next restart, MOSAIC_DOCK_SET T=<n> [PARK_X= PARK_Y= PARK_Z= TAUGHT=0|1 APPROACH= PICKUP_OUT= DROPOFF_OUT=]
gcode:
    {% set n = params.T|default(-1)|int %}
    {% if printer["gcode_macro _MOSAIC_DOCK_T" ~ n] is not defined %}
        { action_raise_error("MOSAIC_DOCK_SET: give T=<tool number 0-9>") }
    {% endif %}
    {% for k in ["PARK_X", "PARK_Y", "PARK_Z"] %}
        {% if k in params %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{n} VARIABLE={k|lower} VALUE={params[k]|float}
        {% endif %}
    {% endfor %}
    {% if "TAUGHT" in params %}
        SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{n} VARIABLE=taught VALUE={params.TAUGHT|int}
    {% endif %}
    {% for k in ["APPROACH", "PICKUP_OUT", "DROPOFF_OUT"] %}
        {% if k in params %}
            SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_T{n} VARIABLE={k|lower} VALUE="'{params[k]}'"
        {% endif %}
    {% endfor %}
    _MOSAIC_DOCK_VALIDATE T={n} SOFT=1
    RESPOND TYPE=echo MSG="This is lost on restart. Put the values into section 7 of MOSAIC/mosaic.cfg to keep them."


[gcode_macro MOSAIC_DOCK_SHOW]
description: MOSAIC dock: MOSAIC_DOCK_SHOW [T=<n>], print the dock settings and paths
gcode:
    {% set s = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% if "T" in params %}
        {% set tools = [params.T|int] %}
    {% elif printer.toolchanger is defined %}
        {% set tools = printer.toolchanger.tool_numbers %}
    {% else %}
        {% set tools = [] %}
    {% endif %}
    RESPOND TYPE=echo MSG="{'MOSAIC dock settings: safe_z %.1f, travel %.0f, z %.0f, approach %.0f, engage %.0f, pullout %.0f mm/s, seat dwell %d ms, restore move %d' % (s.safe_z|float, s.travel_speed|float, s.z_speed|float, s.approach_speed|float, s.engage_speed|float, s.pullout_speed|float, s.seat_dwell|int, s.restore_move|int)}"
    RESPOND TYPE=echo MSG="{'     acceleration: fast %s, slow %s (0 = not touched), switches checked %s, tool count checked before a change %s' % ('%d' % s.accel_fast|default(0)|float(0), '%d' % s.accel_slow|default(0)|float(0), 'yes' if s.check_switches|int == 1 else 'no', 'yes' if s.check_switches|int == 1 and s.check_count|default(1)|int == 1 else 'no')}"
    {% for n in tools %}
        {% set d = printer["gcode_macro _MOSAIC_DOCK_T" ~ n] %}
        {% if d is not defined %}
            RESPOND TYPE=error MSG="{'T%d: no dock section' % n}"
        {% else %}
            {% set ap = (d.approach|string|trim) or (s.approach|string|trim) %}
            {% set po = (d.pickup_out|string|trim) or (s.pickup_out|string|trim) or "(approach backwards)" %}
            {% set dro = (d.dropoff_out|string|trim) or (s.dropoff_out|string|trim) or "(approach backwards)" %}
            RESPOND TYPE=echo MSG="{'T%d: %s  park X%.3f Y%.3f Z%.3f' % (n, 'set up' if d.taught|int == 1 else 'NOT SET UP', d.park_x|float, d.park_y|float, d.park_z|float)}"
            RESPOND TYPE=echo MSG="{'     approach %s   pickup out %s   dropoff out %s' % (ap, po, dro)}"
        {% endif %}
    {% endfor %}


[gcode_macro MOSAIC_DOCK_SWITCHES]
description: MOSAIC dock: print what the carriage switch and the dock switches read right now (press them by hand to test the wiring)
gcode:
    {% set names = {"PRESSED": "tool present", "RELEASED": "empty"} %}
    {% set ts = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined else {} %}
    {% set dl = (ts.dock_switches|default('')|string).split(',') %}
    {% set hname = ts.head_switch|default('mosaic_head')|string|trim %}
    {% set hsw = printer["gcode_button " ~ hname] %}
    {% if hsw is defined %}
        RESPOND TYPE=echo MSG="{'carriage switch (%s): %s' % (hname, names[hsw.state])}"
    {% else %}
        RESPOND TYPE=echo MSG="{'carriage switch: not configured (no [gcode_button %s])' % hname}"
    {% endif %}
    {% set tools = printer.toolchanger.tool_numbers if printer.toolchanger is defined else range(10) %}
    {% for n in tools %}
        {% set dname = dl[n]|trim if n < dl|length and dl[n]|trim != '' else 'mosaic_dock_t' ~ n %}
        {% set dsw = printer["gcode_button " ~ dname] %}
        {% if dsw is defined %}
            RESPOND TYPE=echo MSG="{'dock switch T%d (%s): %s' % (n, dname, names[dsw.state])}"
        {% else %}
            RESPOND TYPE=echo MSG="{'dock switch T%d: not configured (no [gcode_button %s])' % (n, dname)}"
        {% endif %}
    {% endfor %}

[gcode_macro _MOSAIC_DOCK_CHECK_SUMMARY]
description: MOSAIC dock: end of MOSAIC_DOCK_CHECK (internal)
gcode:
    {% set p = printer["gcode_macro _MOSAIC_DOCK_STATE"].check_problems|int %}
    {% if p == 0 %}
        RESPOND TYPE=echo MSG="MOSAIC DOCK CHECK: all good."
    {% else %}
        RESPOND TYPE=error MSG="{'MOSAIC DOCK CHECK: %d problem(s) found, see above.' % p}"
    {% endif %}

[gcode_macro MOSAIC_DOCK_CHECK]
description: MOSAIC dock: check that every tool has a dock and that the toolchanger calls these macros
gcode:
    {% if printer.toolchanger is not defined %}
        { action_raise_error("MOSAIC DOCK CHECK: there is no [toolchanger] section.") }
    {% endif %}
    {% set cs = printer.configfile.settings %}
    {% set tcc = cs["toolchanger"] if cs["toolchanger"] is defined else {} %}
    {% set ns = namespace(hook=0) %}
    {% for n in printer.toolchanger.tool_numbers %}
        {% set tname = printer.toolchanger.tool_names[loop.index0] %}
        {% set tcfg = cs[tname|lower] if cs[tname|lower] is defined else {} %}
        {% for opt, want in [["pickup_gcode", "mosaic_dock_pickup"], ["dropoff_gcode", "mosaic_dock_dropoff"]] %}
            {% set body = (tcfg[opt] if tcfg[opt] is defined else (tcc[opt] if tcc[opt] is defined else ""))|string|lower %}
            {% if want not in body %}
                { action_respond_info("MOSAIC DOCK CHECK: WARN  T%d: %s does not call %s. A tool change will not use the dock macros." % (n, opt, want|upper)) }
                {% set ns.hook = ns.hook + 1 %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% set ts = printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] if printer["gcode_macro _MOSAIC_TOOLS_SETTINGS"] is defined else {} %}
    {% set dl = (ts.dock_switches|default('')|string).split(',') %}
    {% set hname = ts.head_switch|default('mosaic_head')|string|trim %}
    {% if printer["gcode_button " ~ hname] is not defined %}
        { action_respond_info("MOSAIC DOCK CHECK: note  no carriage switch ([gcode_button %s]), a lost tool on the carriage will not be noticed by these macros." % hname) }
    {% endif %}
    {% for n in printer.toolchanger.tool_numbers %}
        {% set dname = dl[n]|trim if n < dl|length and dl[n]|trim != '' else 'mosaic_dock_t' ~ n %}
        {% if printer["gcode_button " ~ dname] is not defined %}
            { action_respond_info("MOSAIC DOCK CHECK: note  T%d has no dock switch ([gcode_button %s]), its dock cannot be checked." % (n, dname)) }
        {% endif %}
    {% endfor %}
    {% set dsn = namespace(missing=0) %}
    {% for n in printer.toolchanger.tool_numbers %}
        {% set dname = dl[n]|trim if n < dl|length and dl[n]|trim != '' else 'mosaic_dock_t' ~ n %}
        {% if printer["gcode_button " ~ dname] is not defined %}
            {% set dsn.missing = dsn.missing + 1 %}
        {% endif %}
    {% endfor %}
    {% set ds = printer["gcode_macro _MOSAIC_DOCK_SETTINGS"] %}
    {% if ds.check_switches|int == 1 and ds.check_count|default(1)|int == 1 and (printer["gcode_button " ~ hname] is not defined or dsn.missing > 0) %}
        { action_respond_info("MOSAIC DOCK CHECK: note  the tool count check before a change needs the carriage switch and a dock switch for every tool, so it is skipped.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MOSAIC_DOCK_STATE VARIABLE=check_problems VALUE={ns.hook}
    {% for n in printer.toolchanger.tool_numbers %}
        _MOSAIC_DOCK_VALIDATE T={n} SOFT=1
    {% endfor %}
    _MOSAIC_DOCK_CHECK_SUMMARY
