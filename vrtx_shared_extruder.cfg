# vrtx_shared_extruder.cfg
#
# Optional. For a hotend swapper with ONE shared extruder motor: the motor is an
# [extruder_stepper] (or the stepper of the [extruder] section) and every tool's
# [extruder] / [extruderN] only brings the heater.
#
# Klipper's SET_PRESSURE_ADVANCE (what OrcaSlicer, Mainsail and Fluidd send) acts on the
# active extruder, and a tool that has only a heater has no motor to set it on ("Active
# extruder does not have a stepper"). This file redirects the command to the shared motor:
# the motor named in variable_motor of _VRTX_TOOLS_SETTINGS (section 2 of VRTX/vrtx.cfg).
# A command that names its own EXTRUDER= is passed on unchanged.
#
# Not together with a SET_PRESSURE_ADVANCE macro of your own. Klipper allows only one.
# Without variable_motor this file does nothing.
#
# The per-tool pressure advance (params_pressure_advance in [tool Tn]) does not need this
# file, VRTX_AFTER_CHANGE applies it to the motor in any case.

[gcode_macro SET_PRESSURE_ADVANCE]
rename_existing: _VRTX_SET_PRESSURE_ADVANCE_BASE
description: Set the pressure advance. With a shared extruder motor (variable_motor) it acts on that motor.
gcode:
    {% set motor = printer["gcode_macro _VRTX_TOOLS_SETTINGS"].motor|default('')|string|trim if printer["gcode_macro _VRTX_TOOLS_SETTINGS"] is defined else '' %}
    {% if motor != '' and 'EXTRUDER' not in params %}
        _VRTX_SET_PRESSURE_ADVANCE_BASE EXTRUDER={motor} {rawparams}
    {% else %}
        _VRTX_SET_PRESSURE_ADVANCE_BASE {rawparams}
    {% endif %}
