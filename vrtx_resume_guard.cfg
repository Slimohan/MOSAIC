# VRTX: optional. A plain RESUME while a tool change has failed would continue the
# print with the wrong tool and offsets. This makes RESUME refuse (with a message that
# points to VRTX_RESUME) until the changer has been repaired.
#
# Only for printers WITHOUT their own RESUME macro. Do NOT include it next to the
# Mainsail or Fluidd client macros: Klipper does not complain about a second
# [gcode_macro RESUME], it merges the two sections and the one read last wins. Included
# after the client macros this file replaces their whole RESUME without any message
# (RESUME_BASE no longer exists, the idle-timeout restore and the extrude are gone);
# included before them the guard is lost. With those client macros use their own hook:
#   [gcode_macro _CLIENT_VARIABLE]
#   variable_user_resume_macro: "VRTX_RESUME_GUARD"
# (it runs first in their RESUME, so the error stops the resume before anything moves).
#
# Include it from section 1 of VRTX/vrtx.cfg:
#   [include core/vrtx_resume_guard.cfg]
[gcode_macro RESUME]
rename_existing: VRTX_BASE_RESUME
description: Resume the print (VRTX: refuses while a failed tool change is not repaired)
gcode:
    VRTX_RESUME_GUARD
    VRTX_BASE_RESUME {rawparams}
