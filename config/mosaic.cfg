# =============================================================================
# MOSAIC: your configuration. This is the ONE file you edit.
# =============================================================================
# printer.cfg includes it:    [include MOSAIC/mosaic.cfg]
#
# MOSAIC works with any board. Everything is set up in this file: either define
# your tools' heaters, fans and switches in sections 5 and 6, or point sections
# 5 and 6 at a config file of your own (the one that came with your board) with
# an include line. MOSAIC refers to the hardware by name only.
#
# Everything MOSAIC needs from you is in this file, in seven sections:
#
#   1  What to load       switch optional MOSAIC parts on or off
#   2  Settings           the Nudge position and the other MOSAIC settings
#   3  MOSAIC's probes    the Nudge probe, the optional Z switch
#   4  Toolchanger        the [toolchanger] section with the dock hooks
#   5  Tools              the hardware of your tools, and one [tool Tn] each
#   6  Switches           carriage and dock switches (optional)
#   7  Dock positions     where every dock is
#
# Work through the sections from top to bottom. Search for  ...  : Klipper
# refuses to start while a section you switched on still has "..." in it.
#
# The order of the sections matters (MOSAIC's T commands must load before the
# tools, your settings after MOSAIC), so add new sections at the end.
#
# core/ in this folder is a link to the MOSAIC download and is replaced by
# updates: never edit anything in core/. Updates never touch this file; if the
# template changes, the new one is saved next to it as mosaic.cfg.new.
# Comments go on their own line, never behind a value. Restart Klipper after
# a change.

# ===========================================================================
# SECTION 1: WHAT TO LOAD
# MOSAIC's own macros, from core/. To leave a part out, put a hash sign in
# front of its [include] line.
# ===========================================================================

[include core/mosaic.cfg]
# T0 ... T9, filament per tool, temperature buttons, tool change log.
# Loads before the tools (section 5), as it must.
[include core/mosaic_tools.cfg]
# M104 / M109 with a T parameter for slicers ("M104 T1 S220"). Needed for
# heater_generic tools; with one [extruderN] per tool Klipper already does it,
# but this file also feeds MOSAIC's standby temperature memory.
# Not together with beacon_heater_hooks.cfg: both define M104 and M109.
#[include core/mosaic_tool_heaters.cfg]
# Docking: pick-up and drop-off for passive (Maxwell / kinematic) couplings.
# Leave it out, and empty section 7, if your changer brings its own
# dock macros; then point the hooks in section 4 (Toolchanger) at those.
[include core/mosaic_dock.cfg]

# ===========================================================================
# SECTION 2: SETTINGS
# Only the values that differ from the defaults. Every setting is explained at
# the top of core/mosaic.cfg and core/mosaic_tools.cfg.
# ===========================================================================

[gcode_macro _MOSAIC_SETTINGS]
variable_reference_tool: 0
# tool_parameter for klipper-toolchanger 2025.12.26 or newer,
# gcode_offset if your tool change macros call SET_GCODE_OFFSET from t<N>_offset_x/y/z
variable_offset_method: 'tool_parameter'
# Where the nozzle of the reference tool hangs just above the middle of the
# Nudge pin (gcode coordinates). The nozzle tip must be well above the pin.
# 1 to 2 mm off is fine, the probing finds the centre itself.
variable_nudge_x: 150.0
variable_nudge_y: 5.0
variable_nudge_z: 15.0
variable_safe_z: 30.0
# 0 = measure cold. 150 = heat every nozzle to 150 C first.
variable_cal_temp: 0
# Only with a separate Z switch ([mosaic_z_probe] in section 3):
#variable_z_switch_x: 60.0
#variable_z_switch_y: 20.0

[gcode_macro _MOSAIC_TOOLS_SETTINGS]
# 'off': a tool that is put away is switched off. 'standby': it goes to standby_temp.
variable_standby_mode: 'off'
variable_standby_temp: 150.0
# Temperature buttons on the page, "name:temperature" separated by commas.
variable_presets: 'PLA:215, PETG:240, ABS:255'
# A tool can have its own buttons, for example T3:
#variable_presets_t3: 'TPU:225'
# OrcaSlicer filament sync (see the README). False switches it off.
#variable_slicer_sync: False

# ===========================================================================
# SECTION 3: MOSAIC'S PROBES
# The calibration equipment that belongs to MOSAIC itself: the Nudge probe and
# the optional Z switch. Set their pins. The hardware of your tools does NOT
# go here, see sections 5 and 6.
# ===========================================================================

# The Nudge probe (https://github.com/zruncho3d/nudge). Its switch is wired like
# a Z endstop. This section comes from klipper-toolchanger and does the probing.
[tools_calibrate]
# Pin of the Nudge switch. Wired normally closed to ground (the usual way):
# ^PF5 . For a normally open wiring use ^!PF5 . Test it by hand: with the
# Nudge at rest MOSAIC_NUDGE_QUERY must say "open", with the pin pushed
# aside it must say "TRIGGERED". If it is the other way round, add or
# remove the ! .
pin: ^PF5
# Sideways travel speed between the probing moves, mm/s
travel_speed: 20
# How far the nozzle starts away from the pin for each side, mm.
# Nozzle diameter / 2 + pin radius + a few mm.
spread: 7
# How far the nozzle goes down beside the pin to touch it, mm
lower_z: 1.0
# Probing speed (slow = accurate) and the retract speed between samples, mm/s
speed: 2
lift_speed: 4
# Lift after the probing: must be more than the height difference between the tools
final_lift_z: 6
sample_retract_dist: 2
samples: 5
samples_tolerance: 0.05
samples_result: median

# Optional: a separate switch that every nozzle presses from above. Z is then
# measured with it (z_source auto), which is more repeatable than the Nudge
# in Z. Leave it out if the Nudge is good enough for you.
#[mosaic_z_probe]
## switch pin, normally closed to ground with the pull-up ^ ; add ! to invert
#pin: ^PG15
#speed: 3
#lift_speed: 10
#samples: 5
#sample_retract_dist: 1.5
#samples_result: median
#samples_tolerance: 0.02
#samples_tolerance_retries: 3
## fallback search distance for MOSAIC_Z_PROBE typed by hand
#max_travel: 6

# Needed for the saved offsets, dock teaching and filament. If printer.cfg
# already has a [save_variables] section, remove one of the two.
[save_variables]
filename: ~/printer_data/config/variables.cfg

# ===========================================================================
# SECTION 4: TOOLCHANGER
# The [toolchanger] section (klipper-toolchanger). Move any [toolchanger]
# options you already have in printer.cfg into this section.
#
# The dock hooks below run MOSAIC's dock macros for every tool change. The
# long {% if %} parts hand over the position the print was at, so that the dock
# macros can go back there safely (sideways at safe height, then down).
# If your changer has its own dock macros, point the hooks at those instead.
# A [tool Tn] section with its own pickup_gcode / dropoff_gcode (even an empty
# one) overrides these.
# ===========================================================================

[toolchanger]
# Hotend swapper with one shared extruder motor only: hand the motor to the
# mounted tool. shared_drive is the [extruder_stepper] in your hardware file.
#after_change_gcode:
#    SYNC_EXTRUDER_MOTION EXTRUDER=shared_drive MOTION_QUEUE={tool.extruder}
pickup_gcode:
    MOSAIC_DOCK_PICKUP T={tool.tool_number}{% if 'X' in restore_position %} RX={restore_position.X}{% endif %}{% if 'Y' in restore_position %} RY={restore_position.Y}{% endif %}{% if 'Z' in restore_position %} RZ={restore_position.Z}{% endif %}
dropoff_gcode:
    MOSAIC_DOCK_DROPOFF T={tool.tool_number}{% if pickup_tool is none %}{% if 'X' in restore_position %} RX={restore_position.X}{% endif %}{% if 'Y' in restore_position %} RY={restore_position.Y}{% endif %}{% if 'Z' in restore_position %} RZ={restore_position.Z}{% endif %}{% endif %}

# ===========================================================================
# SECTION 5: TOOLS
# Part 1: the hardware of your tools (heater, thermistor, fans, extruder motor).
# Part 2: one [tool Tn] section per tool, up to 10 tools, T0 ... T9.
#
# MOSAIC works with any board: it only refers to your hardware by name.
# For Part 1 do ONE of these:
#   A  Your board or toolhead has its own config file (for example one that
#      came with your tool changer). Put it next to printer.cfg and add one
#      include line below.
#   B  Define the heaters and fans here, with the templates below.
# (Using a file from printer.cfg before the MOSAIC include works too.)
#
# To take a tool out, put a hash sign in front of every line of its block
# (its [tool] section AND its heater and fans in Part 1), and of its dock
# switch in section 6. Its saved offsets and filament stay saved.
#
# Move the [tool Tn] sections you already have from printer.cfg into Part 2,
# and their heater, fan and motor sections into Part 1. Klipper refuses to
# start while a line you switched on still has "..." in it.
# ===========================================================================

# ---------------------------------------------------------------------------
# PART 1A: a board file of your own (next to printer.cfg, hence the  ../ ).
# Several files are fine, one line each. Leave this out for 1B.
# ---------------------------------------------------------------------------
#[include ../my_tools.cfg]

# ---------------------------------------------------------------------------
# PART 1B: define the hardware here. Pick the layout that fits your printer.
# ---------------------------------------------------------------------------
# Layout A: every tool is a full toolhead with its own extruder motor
#[extruder]
#step_pin: ...
#dir_pin: ...
#enable_pin: ...
#rotation_distance: ...
#heater_pin: ...
#sensor_type: ...
#sensor_pin: ...
#control: pid
#pid_Kp: ...
#pid_Ki: ...
#pid_Kd: ...
#min_temp: 0
#max_temp: 300
#nozzle_diameter: 0.4
#filament_diameter: 1.75
#
#[heater_fan t0_hotend_fan]
#pin: ...
#heater: extruder
#heater_temp: 50.0
#
#[fan_generic t0_part_fan]
#pin: ...
#
# (T1 with [extruder1], t1_hotend_fan, t1_part_fan, and so on)

# Layout B: hotend swapper, one shared extruder motor
# Every tool has its own heater, thermistor and hotend fan; only the hotend is
# swapped. Each tool is a heater-only [extruder] (no step_pin), and the one
# motor is handed to the mounted tool by after_change_gcode in section 4
# (Toolchanger): remove the hash signs there.
#
#[extruder_stepper shared_drive]
#extruder: extruder
#step_pin: ...
#dir_pin: ...
#enable_pin: ...
#microsteps: 16
#rotation_distance: ...
#
#[extruder]
#heater_pin: ...
#sensor_type: ...
#sensor_pin: ...
#control: pid
#pid_Kp: ...
#pid_Ki: ...
#pid_Kd: ...
#min_temp: 0
#max_temp: 300
#min_extrude_temp: 170
#nozzle_diameter: 0.4
#filament_diameter: 1.75
#
#[heater_fan t0_hotend_fan]
#pin: ...
#heater: extruder
#heater_temp: 50.0
#
# (T1 with [extruder1] and t1_hotend_fan, and so on)
# More examples, including complete board files: core/docs/hardware.md

# ---------------------------------------------------------------------------
# PART 2: the tools. Each one only points at the sections of Part 1 (or of
# your board file) by name.
#   extruder: the [extruder] / [extruderN] section of the tool (its heater,
#             and its motor if it has its own)
#   fan:      optional, the part cooling fan, for example  fan_generic t0_part_fan
# ---------------------------------------------------------------------------
#[tool T0]
#tool_number: 0
#extruder: extruder
#fan: fan_generic t0_part_fan
#
#[tool T1]
#tool_number: 1
#extruder: extruder1
#fan: fan_generic t1_part_fan
#
# ... and so on, up to T9. A hotend swapper with one shared extruder motor
# also needs the after_change_gcode in section 4 (see core/docs/hardware.md).

# ===========================================================================
# SECTION 6: SWITCHES
# Tool switches (optional): one on the carriage, pressed while any tool is
# attached, and one per dock, pressed while its tool sits in the dock.
# Pressed = tool present. A switch that is not defined is simply skipped, so
# without switches leave this section as it is.
# See core/docs/docking.md "Tool switches".
#
# Part 1: define the switches here, or skip it if your board file already
#         has them.
# Part 2: tell MOSAIC their names, only if they are not the names used in
#         Part 1 below (mosaic_head, mosaic_dock_t0 ... mosaic_dock_t9).
# ===========================================================================

# ---------------------------------------------------------------------------
# PART 1: the switches. Remove the hash signs and set your pins; add or remove
# ! in front of a pin if yours reads the other way (check with
# QUERY_BUTTON BUTTON=...).
# ---------------------------------------------------------------------------
# One switch on the carriage. release_gcode pauses a running print if the
# tool falls off.
#[gcode_button mosaic_head]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:
#release_gcode:
#    MOSAIC_DOCK_HEAD_RELEASED

# One switch per dock.
#[gcode_button mosaic_dock_t0]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:
#
#[gcode_button mosaic_dock_t1]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:
#
# ... and so on: mosaic_dock_t2 to mosaic_dock_t9

# ---------------------------------------------------------------------------
# PART 2: names of switches defined elsewhere (this adds to the
# _MOSAIC_TOOLS_SETTINGS of section 2). Without names here MOSAIC looks for
# mosaic_head and mosaic_dock_t0 ... mosaic_dock_t9.
# ---------------------------------------------------------------------------
[gcode_macro _MOSAIC_TOOLS_SETTINGS]
# The carriage switch. Its release_gcode should call
# MOSAIC_DOCK_HEAD_RELEASED so that a print pauses if the tool falls off.
#variable_head_switch: 'carriage_switch'
# One dock switch per tool, in tool order T0, T1, T2 ... separated by commas.
# Leave an entry empty for a tool without a dock switch.
#variable_dock_switches: 'dock_0, dock_1, dock_2, dock_3'

# ===========================================================================
# SECTION 7: DOCK POSITIONS
# Part 1: shared settings (speeds, safe height, default approach path).
# Part 2: one section per tool/dock, T0 to T9, with the position of that dock.
#
# All positions are raw toolhead (carriage) coordinates in mm, the same
# numbers the Mainsail position display shows when no tool offset is active.
# Nothing moves for a tool until its section says  variable_taught: 1
#
# Easy way to fill in a dock: jog the carriage by hand until the tool sits
# fully seated in its dock, then run   MOSAIC_DOCK_TEACH T=0   and paste the
# lines it prints into the section below. See core/docs/docking.md.
#
# Keep the quotes around the path strings.
# ===========================================================================

# ===========================================================================
# Part 1: shared settings
# ===========================================================================
[gcode_macro _MOSAIC_DOCK_SETTINGS]
description: MOSAIC dock: shared settings (edit the numbers in this file, not this macro)
# Height (raw Z, mm) at which the carriage may travel sideways across the
# docks. It must be higher than the tops of ALL tools sitting in their docks,
# and the bed/print must not be in the way either.
variable_safe_z: 40
# Speeds in mm/s
# - travel_speed: free moves at safe height
# - z_speed: up and down moves in free space
# - approach_speed: moves between the approach steps
# - engage_speed: the last move into the dock position (keep it slow)
# - pullout_speed: moves away from the dock (keep it slow for the first steps)
variable_travel_speed: 200
variable_z_speed: 20
variable_approach_speed: 40
variable_engage_speed: 8
variable_pullout_speed: 8
# Pause in milliseconds once the coupling is fully seated, before pulling away
variable_seat_dwell: 300
# After a pickup, go back to where the print was (1) or leave that to the
# toolchanger (0). The macros do it safely: first sideways at safe height, then down.
variable_restore_move: 1
# Check the dock and carriage switches before and after every pickup and
# dropoff (1), or ignore them (0). Switches that are not configured are skipped.
variable_check_switches: 1
# Wait in milliseconds after the carriage has stopped before reading the
# switches, so that they have settled
variable_switch_settle: 300
# Default approach path for every dock, relative to the dock position.
# Format: steps separated by /, each step is dx,dy,dz[,speed[,v]]
#   dx,dy,dz  distance from the dock position in mm
#   speed     optional, mm/s, empty = the default for that kind of move
#   v         optional, in a pickup path: check the tool detection pin there
# The steps run in order and the last move goes to the dock position itself.
# The FIRST step must be in free space where the carriage can come down to.
# Default: stand 25 mm in front of the dock (lower Y), then 5 mm in front, then go in.
variable_approach: "0,-25,0/0,-5,0"
# Default path away from the dock after a pickup / after a dropoff, same format.
# Empty = walk the approach path backwards.
variable_pickup_out: ""
variable_dropoff_out: ""
gcode:


# ===========================================================================
# Part 2: the docks, one section per tool
# ===========================================================================
# variable_taught   0 = not set up yet (no motion), 1 = positions are valid
# variable_park_x/y/z   carriage position with the tool fully seated in its dock
# variable_approach / pickup_out / dropoff_out   only if this dock needs a
#                   path different from the shared default above, otherwise empty

[gcode_macro _MOSAIC_DOCK_T0]
description: MOSAIC dock position of tool T0
variable_taught: 0
variable_park_x: 0.0
variable_park_y: 0.0
variable_park_z: 0.0
variable_approach: ""
variable_pickup_out: ""
variable_dropoff_out: ""
gcode:

