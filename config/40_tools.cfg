# Your tools: one [tool Tn] section per tool, plus the hardware of each tool
# (heater, thermistor, fans). Up to 10 tools, T0 ... T9.
#
# To take a tool out, put a hash sign in front of every line of its block
# (the tool section AND its heater and fans), and of its dock switch in
# 50_switches.cfg. Its saved offsets and filament stay saved.
#
# Move the tool sections you already have (and their [extruder...] and fan
# sections) from printer.cfg into this file. Pick the layout that fits your
# printer and fill in your pins. Klipper refuses to start while a section
# still has "..." in it.

# ===========================================================================
# Layout A: every tool is a full toolhead with its own extruder motor
# ===========================================================================
#[extruder]
#step_pin: ...
#dir_pin: ...
#enable_pin: ...
#rotation_distance: ...
#heater_pin: ...
#sensor_type: ...
#sensor_pin: ...
#control: pid
#pid_Kp: ...
#pid_Ki: ...
#pid_Kd: ...
#min_temp: 0
#max_temp: 300
#nozzle_diameter: 0.4
#filament_diameter: 1.75
#
#[heater_fan t0_hotend_fan]
#pin: ...
#heater: extruder
#heater_temp: 50.0
#
#[fan_generic t0_part_fan]
#pin: ...
#
#[tool T0]
#tool_number: 0
#extruder: extruder
#fan: fan_generic t0_part_fan
#
# (T1 with [extruder1], t1_hotend_fan, t1_part_fan, and so on)

# ===========================================================================
# Layout B: hotend swapper, one shared extruder motor
# ===========================================================================
# Every tool has its own heater, thermistor and hotend fan; only the hotend is
# swapped. Each tool is a heater-only [extruder] (no step_pin), and the one
# motor is handed to the mounted tool by after_change_gcode in 30_toolchanger.cfg
# (remove the hash signs there).
#
#[extruder_stepper shared_drive]
#extruder: extruder
#step_pin: ...
#dir_pin: ...
#enable_pin: ...
#microsteps: 16
#rotation_distance: ...
#
#[extruder]
#heater_pin: ...
#sensor_type: ...
#sensor_pin: ...
#control: pid
#pid_Kp: ...
#pid_Ki: ...
#pid_Kd: ...
#min_temp: 0
#max_temp: 300
#min_extrude_temp: 170
#nozzle_diameter: 0.4
#filament_diameter: 1.75
#
#[heater_fan t0_hotend_fan]
#pin: ...
#heater: extruder
#heater_temp: 50.0
#
#[tool T0]
#tool_number: 0
#extruder: extruder
#
# (T1 with [extruder1] and t1_hotend_fan, and so on)
