# Hardware for the MOSAIC calibration. Set your pins.

# The Nudge probe (https://github.com/zruncho3d/nudge). Its switch is wired like
# a Z endstop. This section comes from klipper-toolchanger and does the probing.
[tools_calibrate]
# Pin of the Nudge switch. Wired normally closed to ground (the usual way):
# ^PF5 . For a normally open wiring use ^!PF5 . Test it by hand: with the
# Nudge at rest MOSAIC_NUDGE_QUERY must say "open", with the pin pushed
# aside it must say "TRIGGERED". If it is the other way round, add or
# remove the ! .
pin: ^PF5
# Sideways travel speed between the probing moves, mm/s
travel_speed: 20
# How far the nozzle starts away from the pin for each side, mm.
# Nozzle diameter / 2 + pin radius + a few mm.
spread: 7
# How far the nozzle goes down beside the pin to touch it, mm
lower_z: 1.0
# Probing speed (slow = accurate) and the retract speed between samples, mm/s
speed: 2
lift_speed: 4
# Lift after the probing: must be more than the height difference between the tools
final_lift_z: 6
sample_retract_dist: 2
samples: 5
samples_tolerance: 0.05
samples_result: median

# Optional: a separate switch that every nozzle presses from above. Z is then
# measured with it (z_source auto), which is more repeatable than the Nudge
# in Z. Leave it out if the Nudge is good enough for you.
#[mosaic_z_probe]
## switch pin, normally closed to ground with the pull-up ^ ; add ! to invert
#pin: ^PG15
#speed: 3
#lift_speed: 10
#samples: 5
#sample_retract_dist: 1.5
#samples_result: median
#samples_tolerance: 0.02
#samples_tolerance_retries: 3
## fallback search distance for MOSAIC_Z_PROBE typed by hand
#max_travel: 6

# Needed for the saved offsets, dock teaching and filament. If printer.cfg
# already has a [save_variables] section, remove one of the two.
[save_variables]
filename: ~/printer_data/config/variables.cfg
