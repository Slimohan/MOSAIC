# Tool switches (optional). Pressed = tool present; add or remove ! in front
# of the pin if yours reads the other way (check with QUERY_BUTTON BUTTON=...).
# The names are fixed, see core/docs/docking.md "Tool switches". A switch that
# is not defined is simply skipped. Remove the hash signs and set your pins.

# One switch on the carriage, pressed while any tool is attached.
# release_gcode pauses a running print if the tool falls off.
#[gcode_button mosaic_head]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:
#release_gcode:
#    MOSAIC_DOCK_HEAD_RELEASED

# One switch per dock, pressed while its tool sits in the dock.
#[gcode_button mosaic_dock_t0]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:
#
#[gcode_button mosaic_dock_t1]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:
#
# ... and so on: mosaic_dock_t2 to mosaic_dock_t9
