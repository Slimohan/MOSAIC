# MOSAIC itself. printer.cfg has the one line
#
#   [include MOSAIC/*.cfg]
#
# which loads every .cfg file in this folder in name order: this file first,
# 90_settings.cfg last. The number in front of a name decides when it loads.
# Your own extra files are loaded too; give them a number, for example
# 45_my_toolboard.cfg loads after the tools and before the switches.
# Backups ending in .bak or .new are ignored, but any other .cfg file in
# this folder IS loaded, so don't leave copies here.
#
# core/ is a link to the MOSAIC download and is replaced by updates: never
# edit anything in core/. Edit the numbered files here instead.
#
# To leave a part of MOSAIC out, put a hash sign in front of its line below.

[include core/mosaic.cfg]
# T0 ... T9, filament per tool, temperature buttons, tool change log.
# Loads before the tools (40_tools.cfg), as it must.
[include core/mosaic_tools.cfg]
# M104 / M109 with a T parameter for slicers ("M104 T1 S220"). Needed for
# heater_generic tools; with one [extruderN] per tool Klipper already does it,
# but this file also feeds MOSAIC's standby temperature memory.
# Not together with beacon_heater_hooks.cfg: both define M104 and M109.
#[include core/mosaic_tool_heaters.cfg]
# Docking: pick-up and drop-off for passive (Maxwell / kinematic) couplings.
# Leave it out, and empty 20_dock_positions.cfg, if your changer brings its own
# dock macros; then point the hooks in 30_toolchanger.cfg at those.
[include core/mosaic_dock.cfg]
