# MOSAIC: optional. A plain RESUME while a tool change has failed would continue the
# print with the wrong tool and offsets. This makes RESUME refuse (with a message that
# points to MOSAIC_RESUME) until the changer has been repaired.
#
# Only for printers WITHOUT their own RESUME macro. Mainsail and Fluidd (the client
# macros) already define [gcode_macro RESUME]; a second one would fail to load.
# There, add  MOSAIC_RESUME_GUARD  as the first line of that RESUME macro instead.
#
# Include it from section 1 of MOSAIC/mosaic.cfg:
#   [include core/mosaic_resume_guard.cfg]
[gcode_macro RESUME]
rename_existing: MOSAIC_BASE_RESUME
description: Resume the print (MOSAIC: refuses while a failed tool change is not repaired)
gcode:
    MOSAIC_RESUME_GUARD
    MOSAIC_BASE_RESUME {rawparams}
